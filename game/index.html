      if(!tg||!tg.alive){
        u.target=null;
        if(u.amove){ const a=u.amove; u.amove=null; u.task={kind:'amove',x:a.x,y:a.y}; moveTo(u,a.x,a.y); }
        else { u.task=null; u.state='idle'; }
        break;
      }
      if(!d.rate){ u.task=null;u.target=null;u.state='idle';break; }
      if(inRange(u,tg,u.st.rng)){
        u.path=null;
        u.dir=faceTo(u,tg.x,tg.y);
        if(u.cd<=0){ u.cd=d.rate; u.frame=5; u.ft=0; doAttack(u,tg); }
      } else {
        u.repathT-=dt;
        if(!u.path||u.repathT<=0){ u.repathT=0.6; moveTo(u,tg.x,tg.y,tg.type==='b'?tg:null); }
      }
      break;
    }
    case 'heal': {
      const tg=u.target;
      if(!tg||!tg.alive||tg.hp>=tg.maxHp){u.task=null;u.target=null;break;}
      if(dist(u.x,u.y,tg.x,tg.y)<3){ u.path=null;u.dir=faceTo(u,tg.x,tg.y);
        tg.hp=Math.min(tg.maxHp,tg.hp+ 7*p.mod.heal*dt);
        if(rnd()<dt*2)G.fx.push({k:'heal',x:tg.x,y:tg.y,t:0,life:.6});
      } else if(!u.path){ moveTo(u,tg.x,tg.y); }
      break;
    }
    case 'gather': {
      const r=u.target;
      if(!r||(r.type==='r'&&r.amt<=0)||(r.type==='b'&&(!r.alive||r.food<=0))){
        const kind=u.carryType;
        const next = r? findRes(u.x,u.y, r.type==='r'? r.kind : 'x', 14) : null;
        if(next){u.target=next;}
        else if(u.carry>0){u.task={kind:'return'};}
        else {u.task=null;u.state='idle';}
        break;
      }
      const rt=RES_OF[r.type==='b'?'farm':r.kind];
      if(u.carry>=CARRY){ u.task={kind:'return'};u.home=r;break; }
      if(dist(u.x,u.y,r.x,r.y) <= (r.type==='b'? r.size*.5+1.1 : 1.35)){
        u.path=null; u.state='gather'; u.dir=faceTo(u,r.x,r.y);
        let rate=GATHER[rt]*p.mod.gather*G.rateMul;
        if(rt==='w')rate*=p.mod.wood;
        else if(rt==='g')rate*=p.mod.ore;
        else if(rt==='s')rate*=p.mod.ore*p.mod.stone;
        else if(r.type==='b')rate*=p.mod.farmRate;
        else if(r.kind==='berry')rate*=p.mod.berry;
        const take=Math.min(rate*dt, CARRY-u.carry, r.type==='b'?r.food:r.amt);
        u.carry+=take; u.carryType=rt;
        if(r.type==='b'){r.food-=take; r.stage=clamp(3-Math.floor(r.food/((BLD.farm.farm+p.mod.farm)/3.02)),0,3);
          if(r.food<=0){killEnt(r);} }
        else { r.amt-=take;
          if(r.amt<=0){ if(r.kind==='tree')G.fx.push({k:'stump',x:r.x,y:r.y,t:0,life:40}); removeRes(r);} }
        if(rnd()<dt*3)G.fx.push({k:'chip',x:r.x,y:r.y,t:0,life:.4,kind:r.kind});
      } else {
        u.repathT-=dt;
        if(!u.path||u.repathT<=0){u.repathT=1.2;
          if(!moveTo(u,r.x,r.y,r.type==='b'?r:{id:r.id})){ u.task=null;u.state='idle'; } }
      }
      break;
    }
    case 'return': {
      const drop=u.dropB&&u.dropB.alive? u.dropB : findDrop(u,u.carryType);
      u.dropB=drop;
      if(!drop){ u.task=u.home?{kind:'gather'}:null; u.target=u.home; break; }
      if(dist(u.x,u.y,drop.x,drop.y)<=drop.size*.55+1.0){
        p.res[u.carryType]+=u.carry; p.stats.gathered+=u.carry;
        u.carry=0; u.path=null; u.dropB=null;
        if(u.home&&((u.home.type==='r'&&u.home.amt>0)||(u.home.type==='b'&&u.home.alive&&u.home.food>0))){
          u.task={kind:'gather'};u.target=u.home;
        } else {
          const next=findRes(u.x,u.y,u.home&&u.home.kind?u.home.kind:'tree',16);
          if(next){u.task={kind:'gather'};u.target=next;}else{u.task=null;u.state='idle';}
        }
      } else { u.repathT-=dt;
        if(!u.path||u.repathT<=0){u.repathT=1.4;moveTo(u,drop.x,drop.y,drop);} }
      break;
    }
    case 'build': case 'repair': {
      const b=u.target;
      if(!b||!b.alive||(u.task.kind==='build'&&b.built>=1&&b.hp>=b.maxHp)){u.task=null;u.state='idle';u.target=null;break;}
      if(dist(u.x,u.y,b.x,b.y)<=b.size*.55+1.1){
        u.path=null;u.state='build';u.dir=faceTo(u,b.x,b.y);
        if(b.built<1){
          const rate=1/BLD[b.kind].build*G.rateMul;
          b.built=Math.min(1,b.built+rate*dt);
          b.hp=Math.min(b.maxHp,b.maxHp*(0.08+0.92*b.built));
          if(b.built>=1)finishBld(b);
        } else if(b.hp<b.maxHp){
          b.hp=Math.min(b.maxHp,b.hp+ b.maxHp/(BLD[b.kind].build*1.6)*dt);
          if(b.hp>=b.maxHp){u.task=null;u.state='idle';}
        }
        if(rnd()<dt*4)G.fx.push({k:'chip',x:b.x+(rnd()-.5)*b.size,y:b.y+(rnd()-.5)*b.size,t:0,life:.4,kind:'build'});
      } else { u.repathT-=dt;
        if(!u.path||u.repathT<=0){u.repathT=1.2; if(!moveTo(u,b.x,b.y,b)){u.task=null;u.state='idle';}} }
      break;
    }
    case 'amove': {
      if(!u.path){ u.task=null;u.state='idle'; }
      break;
    }
    case 'move': if(!u.path){u.task=null;u.state='idle';} break;
  }
  moveAlong(u,dt);
}
/* 0:E 1:SE 2:S 3:SW 4:W 5:NW 6:N 7:NE, measured in screen space */
function faceTo(u,x,y){
  const dx=x-u.x, dy=y-u.y;
  if(!dx&&!dy)return u.dir||0;
  const sx=(dx-dy), sy=(dx+dy)*.5;
  const a=Math.atan2(sy,sx);
  return ((Math.round(a/(Math.PI/4))%8)+8)%8;
}
const DIR_CANON=[0,1,2,1,0,3,4,3];      /* facing -> pose the atlas actually stores */
const DIR_FLIP =[1,1,0,0,0,0,0,1];      /* facing -> draw mirrored */
const CANON_PROFILE=[1,.75,.25,.75,.25];/* how side-on the pose is */
function moveAlong(u,dt){
  if(!u.path||u.pi>=u.path.length){
    if(u.path&&u.pi>=u.path.length){u.path=null;if(u.task&&(u.task.kind==='move'))u.task=null;}
    if(u.state==='move')u.state='idle';
    animIdle(u,dt); return;
  }
  const wp=u.path[u.pi];
  const spd=u.st.spd*G.rateMul*((u.auraT>G.time)?u.auraSpd:1);
  let dx=wp.x-u.x, dy=wp.y-u.y, dd=Math.hypot(dx,dy);
  if(dd<0.14){ u.pi++; if(u.pi>=u.path.length){u.path=null;} animIdle(u,dt); return; }
  dx/=dd;dy/=dd;
  /* local separation so crowds don't stack */
  let sx=0,sy=0;
  forNear(u.x,u.y,1.1,(o)=>{
    if(o===u||!o.alive)return;
    const ox=u.x-o.x, oy=u.y-o.y, od=Math.hypot(ox,oy);
    if(od<0.62&&od>0.0001){ sx+=ox/od*(0.62-od); sy+=oy/od*(0.62-od); }
  });
  let mx=dx+sx*2.2, my=dy+sy*2.2;
  const ml=Math.hypot(mx,my)||1; mx/=ml;my/=ml;
  let nx=u.x+mx*spd*dt, ny=u.y+my*spd*dt;
  if(!passableFor(nx|0,ny|0,0)){
    if(passableFor(nx|0,u.y|0,0))ny=u.y; else if(passableFor(u.x|0,ny|0,0))nx=u.x;
    else {nx=u.x;ny=u.y;u.repathT=0;}
  }
  u.x=clamp(nx,.3,G.w-.3);u.y=clamp(ny,.3,G.h-.3);
  u.dir=faceTo(u,u.x+mx,u.y+my);
  u.state = u.state==='gather'||u.state==='build'? u.state : 'move';
  u.ft+=dt*(6*spd); u.frame=1+(((u.ft)|0)%4);
}
/* animation for units that are standing still */
function animIdle(u,dt){
  if(u.frame>=5&&u.cd>0&&u.state==='attack'){ u.ft+=dt*7; u.frame=u.ft%1<.5?5:6; return; }
  if(u.state==='gather'||u.state==='build'){ u.ft+=dt*5.5; u.frame=5+(((u.ft)|0)%2); return; }
  if(u.state==='attack'&&u.cd>0.001){ u.ft+=dt*6; u.frame=u.ft%1<.45?6:0; return; }
  u.frame=0;
}

/* ---------- buildings ---------- */
function updateBld(b,dt){
  const p=G.players[b.owner], B=BLD[b.kind];
  if(b.hitT>0)b.hitT-=dt;
  if(b.built<1)return;
  if(B.aura){
    const A=B.aura;
    if(A.spd||A.heal){
      forNear(b.x,b.y,A.r,(u)=>{
        if(u.owner!==b.owner||!u.alive)return;
        if(dist(u.x,u.y,b.x,b.y)>A.r)return;
        if(A.spd){u.auraSpd=A.spd;u.auraT=G.time+.2;}
        if(A.heal&&u.hp<u.maxHp)u.hp=Math.min(u.maxHp,u.hp+A.heal*dt);
      });
    }
    if(A.repair){
      for(const o of G.blds){
        if(o.owner!==b.owner||o===b||!o.alive||o.built<1||o.hp>=o.maxHp)continue;
        if(dist(o.x,o.y,b.x,b.y)>A.r)continue;
        o.hp=Math.min(o.maxHp,o.hp+A.repair*dt);
      }
    }
  }
  if(B.atk){
    b.cd-=dt;
    if(b.cd<=0){
      let tgt=null,bd=B.rng*B.rng;
      forNear(b.x,b.y,B.rng+2,(o)=>{if(o.alive&&o.owner!==b.owner){const dd=dist2(b.x,b.y,o.x,o.y);if(dd<bd){bd=dd;tgt=o;}}});
      if(tgt){ b.cd=B.rate; b.st={atk:B.atk,rng:B.rng};
        const shots=B.arrows||1;
        for(let i=0;i<shots;i++){
          G.projs.push({x:b.x,y:b.y-1.4,sx:b.x,sy:b.y-1.4,tx:tgt.x,ty:tgt.y,t:-i*.09,dur:.32,
            dmg:Math.max(1,B.atk-((tgt.st&&tgt.st.pa)||0)),src:b,tgt,splash:0,kind:'arrow'});
        }
        sfx('bow');
      }
    }
  }
  /* training queue */
  if(b.queue.length){
    const it=b.queue[0];
    if(it.kind==='unit'){
      if(p.pop>=p.popCap){ b.blockedPop=true;
        if(p===G.human&&G.time-(p.popWarn||-99)>20){p.popWarn=G.time;pushAlert('Population capped — build a House','warn');} }
      else{ b.blockedPop=false; b.qt+=dt*G.rateMul;
        if(b.qt>=it.time){
          b.qt=0;b.queue.shift();
          const sp=spawnSpot(b);
          const u=spawnUnit(it.id,b.owner,sp.x,sp.y);
          if(b.rally){
            if(b.rally.res&&b.rally.res.alive!==false&&u.kind==='villager'&&b.rally.res.amt>0){cmdGather([u],b.rally.res);}
            else cmdMove([u],b.rally.x,b.rally.y);
          }
          if(p===G.human)sfx('spawn');
        }}
    } else {
      b.qt+=dt*G.rateMul;
      if(b.qt>=it.time){ b.qt=0;b.queue.shift();
        if(it.kind==='tech')applyTech(p,it.id);
        else if(it.kind==='upg')applyUpgrade(p,it.id,it.lvl);
        else if(it.kind==='age')advanceAge(p);
      }
    }
  }
}
function spawnSpot(b){
  const cx=b.tx+b.size/2, cy=b.ty+b.size/2;
  for(let r=Math.ceil(b.size/2);r<b.size/2+5;r++){
    for(let a=0;a<16;a++){
      const ang=a/16*6.283, x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
      if(passableFor(x|0,y|0,0))return {x:x,y:y};
    }
  }
  return {x:cx,y:cy+b.size/2+.6};
}
function canAfford(p,cost){ for(const k in cost) if(p.res[k]<cost[k])return false; return true; }
function pay(p,cost){ for(const k in cost)p.res[k]-=cost[k]; }
function refund(p,cost){ for(const k in cost)p.res[k]+=cost[k]; }
function trainSpeed(p,id){
  let m=1;
  for(const b of p.landmarks) if(b.alive&&b.built>=1){
    const tf=BLD[b.kind].trainFast; if(tf&&tf[id])m*=tf[id];
  }
  return m;
}
function queueUnit(b,id){
  const p=G.players[b.owner], cost=unitCost(p,id);
  if(b.queue.length>=12)return false;
  if(!canAfford(p,cost)){ if(p===G.human)needRes(cost); return false; }
  pay(p,cost);
  b.queue.push({kind:'unit',id,time:unitTime(p,id)*trainSpeed(p,id),cost});
  return true;
}
function queueTech(b,id){
  const p=G.players[b.owner], t=TECHS[id];
  if(p.techs.has(id)||b.queue.some(q=>q.id===id))return false;
  if(!canAfford(p,t.cost)){if(p===G.human)needRes(t.cost);return false;}
  pay(p,t.cost); b.queue.push({kind:'tech',id,time:t.t,cost:t.cost}); return true;
}
function queueUpg(b,kind,lvl){
  const p=G.players[b.owner], up=UPGRADES[kind][lvl];
  if(!canAfford(p,up.cost)){if(p===G.human)needRes(up.cost);return false;}
  pay(p,up.cost); b.queue.push({kind:'upg',id:kind,lvl,time:45,cost:up.cost}); return true;
}
function applyTech(p,id){
  if(p.techs.has(id))return; p.techs.add(id); TECHS[id].fx(p); refreshStats(p);
  if(p===G.human){toast(TECHS[id].n+' researched');sfx('tech');}
}
function applyUpgrade(p,kind,lvl){
  p.upg[kind]=Math.max(p.upg[kind]||0,lvl+1); refreshStats(p);
  if(p===G.human){toast(UPGRADES[kind][lvl].n+' upgraded');sfx('tech');}
}
function refreshStats(p){
  for(const u of G.units){ if(u.owner!==p.id)continue;
    const frac=u.hp/u.maxHp, st=unitStats(p,u.kind);
    u.st=st;u.maxHp=st.hp;u.hp=Math.min(st.hp,Math.max(1,frac*st.hp)); }
}
function queueAge(b){
  const p=G.players[b.owner], a=AGE_UP[p.age+1];
  if(!a)return false;
  const cost={}; if(a.f)cost.f=a.f; if(a.g)cost.g=a.g;
  if(!canAfford(p,cost)){if(p===G.human)needRes(cost);return false;}
  if(b.queue.some(q=>q.kind==='age'))return false;
  pay(p,cost); b.queue.push({kind:'age',id:'age',time:a.time,cost}); return true;
}
function advanceAge(p){
  p.age++; refreshStats(p);
  for(const u of G.units)if(u.owner===p.id){u.hp=Math.min(u.maxHp,u.hp+ (u.kind==='villager'?0:0));}
  if(p===G.human){ showBanner(AGES[p.age]); sfx('age'); }
  else if(G.human) pushAlert(p.name+' advanced to the '+AGES[p.age],'warn');
}
</script>
<script>
/* ============================================================
   FOG OF WAR (human player only)
   ============================================================ */
let visDirty=true, visT=0;
function markVisDirty(){visDirty=true;}
function initVision(p){ const N=G.w*G.h; p.explored=new Uint8Array(N); p.vis=new Uint8Array(N); }
function stampVis(p,cx,cy,r){
  const x0=Math.max(0,(cx-r)|0),x1=Math.min(G.w-1,(cx+r)|0),y0=Math.max(0,(cy-r)|0),y1=Math.min(G.h-1,(cy+r)|0);
  const r2=r*r;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x+.5-cx,dy=y+.5-cy;
    if(dx*dx+dy*dy<=r2){const i=idx(x,y);p.vis[i]=1;p.explored[i]=1;}
  }
}
function updateVision(p){
  p.vis.fill(0);
  const sc=p.mod.scoutLos||0, bl=p.mod.bldLos||0;
  for(const u of G.units) if(u.owner===p.id)
    stampVis(p,u.x,u.y,UNITS[u.kind].los+(u.kind==='scout'?1+sc:(UNITS[u.kind].cls==='cavalry'?sc:0)));
  for(const b of G.blds) if(b.owner===p.id) stampVis(p,b.x,b.y,BLD[b.kind].los+bl+b.size*.4);
  visDirty=false;
}
const seenAt=(p,x,y)=> p.vis[idx(x|0,y|0)]===1;
const knownAt=(p,x,y)=> p.explored[idx(x|0,y|0)]===1;

/* ============================================================
   COMPUTER OPPONENT
   ============================================================ */
/* ------------------------------------------------------------
   The opponent is a small strategic planner, not a pile of rules
   that fire independently. Two plan slots run concurrently — one
   owns the villagers and the treasury, one owns the army — because
   an RTS economy cannot pause while a battle is on. A plan holds
   its units until it reaches COMPLETE, FAILED or RETREATING, so no
   generic "go home" rule can overwrite an attack mid-march.
   ------------------------------------------------------------ */
const AI_CFG = {
  think: 1.2,                       /* seconds between strategic decisions */
  work:  {berry:3, tree:3, gold:4, stone:4, farm:1},
  build: {maxPending:{house:1, farm:2, tc:1, castle:1, wonder:1, def:2}, cd:{house:6, farm:4, mil:10}},
  attack:{minForce:8, musterWait:35, targetLock:22, regroup:9, retreatAt:.42, engageRange:13},
};
const AI_MIX={
  0:{f:.50,w:.38,g:.09,s:.03},
  1:{f:.42,w:.34,g:.16,s:.08},
  2:{f:.40,w:.30,g:.22,s:.08},
  3:{f:.38,w:.28,g:.26,s:.08},
};
function newBrain(p,diff){
  return {p, diff, t:99, base:null,
    econ:null, mil:null,                 /* the two live plans */
    reserve:{f:0,w:0,g:0,s:0},           /* treasury the econ plan has ring-fenced */
    cd:{house:0,farm:0,mil:0},
    wave:0, nextAttack: diff==='easy'?430:(diff==='hard'?175:300),
    defendT:0, tele:{},
  };
}
/* ---- treasury: reserved resources may only be spent by the plan that reserved them ---- */
function aiFree(p,k){ return p.res[k]-(p.brain.reserve[k]||0); }
function aiCanSpend(p,cost,privileged){
  for(const k in cost){ if((privileged? p.res[k] : aiFree(p,k)) < cost[k]) return false; }
  return true;
}
function aiSpend(p,cost,privileged){
  if(!aiCanSpend(p,cost,privileged))return false;
  pay(p,cost); return true;
}
function aiSetReserve(p,cost){
  const r=p.brain.reserve; r.f=r.w=r.g=r.s=0;
  for(const k in cost)r[k]=cost[k];
}
/* ---- shared queries ---- */
function workersOn(p,res){
  let n=0; for(const u of G.units)
    if(u.owner===p.id&&u.kind==='villager'&&u.target===res&&u.task&&
       (u.task.kind==='gather'||u.task.kind==='return'))n++;
  return n;
}
function findResFree(p,x,y,kind,maxR,cap){
  let best=null,bd=(maxR||24)**2;
  for(const r of G.res){
    if(r.kind!==kind||r.amt<=0)continue;
    const d=dist2(x,y,r.x,r.y);
    if(d<bd&&workersOn(p,r)<cap){bd=d;best=r;}
  }
  return best;
}
function aiVillagers(p){const a=[];for(const u of G.units)if(u.owner===p.id&&u.kind==='villager')a.push(u);return a;}
function aiArmy(p){const a=[];for(const u of G.units)if(u.owner===p.id&&u.kind!=='villager'&&u.alive)a.push(u);return a;}
function aiTC(p){for(const b of G.blds)if(b.owner===p.id&&b.kind==='tc'&&b.alive)return b;return null;}
function aiBuildingsOf(p,kind){let n=0;for(const b of G.blds)if(b.owner===p.id&&b.kind===kind&&b.alive)n++;return n;}
function aiPending(p,kind){let n=0;for(const b of G.blds)if(b.owner===p.id&&b.kind===kind&&b.built<1)n++;return n;}
function aiPower(units){
  let v=0; for(const u of units) if(u.alive) v+=(u.st.atk+u.st.ar*2)*(u.hp/Math.max(1,u.maxHp))+4;
  return v;
}
function aiFindSpot(p,kind,near,minR){
  const B=BLD[kind], n=B.size;
  const cx=near.x|0, cy=near.y|0;
  for(let r=(minR||2);r<26;r++){
    for(let a=0;a<Math.max(8,r*5);a++){
      const ang=rnd()*6.283, x=Math.round(cx+Math.cos(ang)*r), y=Math.round(cy+Math.sin(ang)*r);
      if(!canPlace(kind,x,y,null))continue;
      let clear=true;
      for(let yy=y-1;yy<y+n+1&&clear;yy++)for(let xx=x-1;xx<x+n+1;xx++){
        if(!inMap(xx,yy)){clear=false;break;}
        const o=G.occ[idx(xx,yy)];
        if(o){const e=G.ents.get(o); if(e&&e.type==='b'){clear=false;break;}}
      }
      if(clear)return {x,y};
    }
  }
  return null;
}
const TARGET_WEIGHT={tc:.45, barracks:.6, range:.6, stable:.6, siege:.6, castle:.7, monastery:.8,
  mill:.85, lumber:.85, mining:.85, smith:.9, relay:.6, themehall:.6, marchkeep:.8,
  wonder:.3, house:2.2, farm:3.0, tower:1.6};
function aiEnemyTarget(p,from){
  let best=null,bd=1e9;
  const base=from||p.brain.base||{x:G.w/2,y:G.h/2};
  for(const b of G.blds){
    if(b.owner===p.id||!b.alive)continue;
    const pl=G.players[b.owner]; if(!pl||pl.id===p.id)continue;
    const w=TARGET_WEIGHT[b.kind]!==undefined?TARGET_WEIGHT[b.kind]:1;
    const d=dist2(base.x,base.y,b.x,b.y)*w;
    if(d<bd){bd=d;best=b;}
  }
  if(best)return best;
  let bu=null,bud=1e9;
  for(const u of G.units){ if(u.owner===p.id||!u.alive)continue;
    const d=dist2(base.x,base.y,u.x,u.y); if(d<bud){bud=d;bu=u;} }
  return bu;
}
function aiThreat(p){
  const br=p.brain;
  for(const b of G.blds){
    if(b.owner!==p.id||b.hitT<=0)continue;
    if(br.base&&dist(b.x,b.y,br.base.x,br.base.y)>26)continue;
    return {x:b.x,y:b.y};
  }
  for(const u of G.units){
    if(u.owner!==p.id||u.kind!=='villager'||u.hitT<=0)continue;
    return {x:u.x,y:u.y};
  }
  return null;
}

/* ---- economy plans: GROW, AGE_UP, FARM_TRANSITION, REBUILD ---- */
function aiEconPlan(p,step){
  const br=p.brain, vil=aiVillagers(p), tc=aiTC(p);
  const ageCost=AGE_UP[p.age+1];
  const cost=ageCost? Object.assign({}, ageCost.f?{f:ageCost.f}:{}, ageCost.g?{g:ageCost.g}:{}) : null;
  const easy=br.diff==='easy';
  const vilTarget=(easy?[12,16,18,18]:br.diff==='hard'?[18,26,32,32]:[16,22,26,26])[p.age];
  const ageQueued=G.blds.some(b=>b.owner===p.id&&b.queue.some(q=>q.kind==='age'));
  let type='GROW';
  if(!tc) type='REBUILD';
  else if(ageCost && !ageQueued && vil.length>=Math.round(vilTarget*.85) && aiBuildingsOf(p,'barracks')>0)
    type='AGE_UP';
  const foodNodes=G.res.some(r=>r.kind==='berry'&&r.amt>0&&br.base&&dist(r.x,r.y,br.base.x,br.base.y)<24);
  if(type==='GROW' && !foodNodes && aiBuildingsOf(p,'farm')<3) type='FARM_TRANSITION';

  if(!br.econ||br.econ.type!==type) br.econ={type,started:G.tick};
  const plan=br.econ;

  /* ring-fence what the plan needs before anything else can spend it */
  if(type==='AGE_UP'&&cost) aiSetReserve(p,cost);
  else if(type==='FARM_TRANSITION') aiSetReserve(p,{w:bldCost(p,'farm').w*2});
  else if(type==='REBUILD') aiSetReserve(p,BLD.tc.cost);
  else aiSetReserve(p,{});
  plan.vilTarget=vilTarget;
  return plan;
}
/* ---- military plan: MUSTER -> TRAVEL -> ENGAGE -> REGROUP -> RETREAT/COMPLETE ---- */
function aiOwned(br,u){ return br.mil && br.mil.units.indexOf(u.id)>=0; }
function aiStartAttack(p,units,target){
  const br=p.brain, A=AI_CFG.attack;
  br.mil={type:'ATTACK',state:'MUSTER',units:units.map(u=>u.id),
    target:target?target.id:0, at:target?{x:target.x,y:target.y}:null,
    started:G.tick,lastCmd:0,lock:0,power0:aiPower(units),regroupT:0};
  br.wave++;
  const rally=br.base||{x:G.w/2,y:G.h/2};
  for(const u of units) cmdMove([u],rally.x+rndi(7)-3,rally.y+rndi(7)-3);
  if(G.human&&br.wave===1&&target)
    pushAlert(p.name+' is marching on you — raise soldiers','warn',{x:target.x,y:target.y});
}
function aiMilPlan(p,step){
  const br=p.brain, A=AI_CFG.attack, army=aiArmy(p);
  const threat=aiThreat(p);
  br.defendT=threat? 12 : Math.max(0,br.defendT-step);

  /* a raid on the town outranks anything short of an attack already in contact */
  if(threat && (!br.mil || br.mil.type!=='DEFEND') &&
     (!br.mil || br.mil.state!=='ENGAGE' || dist(br.mil.at.x,br.mil.at.y,br.base.x,br.base.y)<30)){
    br.mil={type:'DEFEND',state:'ENGAGE',units:army.map(u=>u.id),at:threat,target:0,
      started:G.tick,lastCmd:0,lock:0,power0:aiPower(army),regroupT:0};
  }
  let plan=br.mil;
  if(plan){
    plan.units=plan.units.filter(id=>{const u=G.ents.get(id);return u&&u.alive;});
    const units=plan.units.map(id=>G.ents.get(id)).filter(Boolean);
    if(!units.length){ br.mil=null; plan=null; }
    else {
      const power=aiPower(units);
      const age=(G.tick-plan.started)/30;
      if(plan.type==='DEFEND'){
        if(br.defendT<=0){ br.mil=null; }
        else {
          plan.at=threat||plan.at;
          if(G.tick-plan.lastCmd>45){ plan.lastCmd=G.tick;
            for(const u of units) if(!u.target||!u.target.alive) cmdAttackMove([u],plan.at.x,plan.at.y); }
          /* pull in anything new that has finished training */
          for(const u of army) if(plan.units.indexOf(u.id)<0 && dist(u.x,u.y,br.base.x,br.base.y)<34) plan.units.push(u.id);
        }
      } else if(plan.type==='ATTACK'){
        const tgt=G.ents.get(plan.target);
        if(plan.state==='MUSTER'){
          for(const u of army) if(plan.units.indexOf(u.id)<0) plan.units.push(u.id);
          const need=Math.min(A.minForce+br.wave*(br.diff==='hard'?2.5:2), br.diff==='easy'?16:30);
          if(units.length>=need || age>A.musterWait){
            plan.state='TRAVEL'; plan.lastCmd=0;
          }
        }
        if(plan.state==='TRAVEL'||plan.state==='ENGAGE'){
          /* Reinforcements muster at home and march as a body. Feeding them in
             one at a time is how an attack becomes a grinder that never ends. */
          plan.pending=(plan.pending||[]).filter(id=>{const u=G.ents.get(id);return u&&u.alive;});
          for(const u of army){
            if(plan.units.indexOf(u.id)>=0||plan.pending.indexOf(u.id)>=0)continue;
            if(br.base&&dist(u.x,u.y,br.base.x,br.base.y)>20)continue;
            plan.pending.push(u.id);
          }
          if(plan.pending.length>=4){
            for(const id of plan.pending){
              const u=G.ents.get(id); if(!u)continue;
              plan.units.push(id);
              cmdAttackMove([u],plan.at.x+rndi(5)-2,plan.at.y+rndi(5)-2);
            }
            plan.pending=[];
          }
        }
        if(plan.state==='TRAVEL'){
          if(!tgt||!tgt.alive){ const t2=aiEnemyTarget(p); if(t2){plan.target=t2.id;plan.at={x:t2.x,y:t2.y};} }
          if(G.tick-plan.lastCmd>60){ plan.lastCmd=G.tick;
            for(const u of units) if(!u.task||(!u.target&&u.task.kind!=='amove'))
              cmdAttackMove([u],plan.at.x+rndi(5)-2,plan.at.y+rndi(5)-2); }
          const arrived=units.filter(u=>dist(u.x,u.y,plan.at.x,plan.at.y)<A.engageRange).length;
          if(arrived>=Math.max(1,units.length*0.4)) plan.state='ENGAGE';
          if(age>180) plan.state='ENGAGE';
        }
        else if(plan.state==='ENGAGE'){
          /* a push that has ground on for minutes should reform rather than trickle */
          if(age>200){ plan.state='RETREAT'; plan.lastCmd=0; }
          else if(power < plan.power0*A.retreatAt && units.length<3){ plan.state='RETREAT'; }
          else {
            plan.lock-=step;
            if((!tgt||!tgt.alive)&&plan.lock<=0){
              const mid=units[0];
              const t2=aiEnemyTarget(p,mid);
              if(t2){ plan.target=t2.id; plan.at={x:t2.x,y:t2.y}; plan.lock=A.targetLock; }
              else { br.mil=null; }
            }
            if(br.mil&&G.tick-plan.lastCmd>90){ plan.lastCmd=G.tick;
              for(const u of units) if(!u.task&&(!u.target||!u.target.alive))
                cmdAttackMove([u],plan.at.x+rndi(5)-2,plan.at.y+rndi(5)-2); }
          }
        }
        else if(plan.state==='RETREAT'){
          if(G.tick-plan.lastCmd>60){ plan.lastCmd=G.tick;
            for(const u of units) if(!u.target||!u.target.alive) cmdMove([u],br.base.x+rndi(9)-4,br.base.y+rndi(9)-4); }
          if(units.every(u=>dist(u.x,u.y,br.base.x,br.base.y)<16)||age>260){ br.mil=null; br.nextAttack=Math.min(br.nextAttack,55); }
        }
      }
    }
  }
  /* no plan in charge: consider opening one, otherwise garrison the town */
  br.nextAttack-=step*(br.diff==='hard'?1.5:br.diff==='easy'?.8:1.1)*(((CIVS[p.civ]||CIVS.free).ai||{}).aggr||1);
  if(!br.mil && !br.defendT){
    const need=Math.min(A.minForce+br.wave*(br.diff==='hard'?2.5:2), br.diff==='easy'?16:30);
    if((br.nextAttack<=0||army.length>=need)&&army.length>=Math.min(need,br.diff==='easy'?6:5)){
      const tgt=aiEnemyTarget(p);
      if(tgt){ aiStartAttack(p,army,tgt); br.nextAttack=(br.diff==='easy'?150:br.diff==='hard'?70:100); }
    }
  }
  for(const u of army){
    if(aiOwned(br,u)||u.task||(u.target&&u.target.alive))continue;
    if(br.base&&dist(u.x,u.y,br.base.x,br.base.y)>16) cmdMove([u],br.base.x+rndi(8)-4,br.base.y+rndi(8)-4);
  }
}

function aiThink(p,dt){
  const br=p.brain; br.t+=dt;
  if(br.t<AI_CFG.think)return;
  const step=br.t; br.t=0;
  const tc=aiTC(p), vil=aiVillagers(p), army=aiArmy(p);
  if(tc&&!br.base)br.base={x:tc.x,y:tc.y};
  const civ=CIVS[p.civ]||CIVS.free;
  const mix=Object.assign({},AI_MIX[p.age],(civ.ai&&civ.ai.mix&&p.age>0)?civ.ai.mix:{});
  const easy=br.diff==='easy', hard=br.diff==='hard';
  for(const k in br.cd) br.cd[k]=Math.max(0,br.cd[k]-step);
  if(hard){ p.res.f+=1.6*step;p.res.w+=1.4*step;p.res.g+=.5*step;p.res.s+=.25*step; }

  const econ=aiEconPlan(p,step);
  const W=AI_CFG.work;

  /* ---- villagers: every one of them should be carrying something ---- */
  const counts={f:0,w:0,g:0,s:0}, free=[];
  for(const u of vil){
    const t=u.task;
    if(!t){free.push(u);continue;}
    if(t.kind==='build'||t.kind==='repair')continue;
    if(t.kind==='gather'&&!u.target){free.push(u);continue;}
    const k=u.carryType||(u.target?RES_OF[u.target.type==='b'?'farm':u.target.kind]:null);
    if(k)counts[k]++;
  }
  const want={};
  for(const k of RES_KEYS)want[k]=Math.max(k==='f'?3:1,Math.round(vil.length*mix[k]));
  if(p.res.f<150)want.f+=2;
  if(p.res.w<80)want.w+=1;
  if(econ.type==='AGE_UP'){ want.f+=3; want.g+=1; }
  if(!free.length&&counts.f<want.f-1){
    const c=vil.find(u=>u.carryType==='w'&&u.task&&u.task.kind==='gather');
    if(c)free.push(c);
  }
  let farmsQueued=0;
  for(const u of free.slice(0,4)){
    let k='f',gap=-99;
    for(const kk of RES_KEYS){const g2=want[kk]-counts[kk];if(g2>gap){gap=g2;k=kk;}}
    counts[k]++;
    let r=null;
    if(k==='f'){
      r=findResFree(p,u.x,u.y,'berry',24,W.berry);
      if(!r){
        const farm=G.blds.find(b=>b.owner===p.id&&b.kind==='farm'&&b.alive&&b.food>0&&workersOn(p,b)<W.farm);
        if(farm){cmdGather([u],farm);continue;}
        const privileged = econ.type==='FARM_TRANSITION';
        if(br.cd.farm<=0 && farmsQueued<2 && aiPending(p,'farm')<AI_CFG.build.maxPending.farm &&
           aiBuildingsOf(p,'farm')<Math.max(6,vil.length*.6) && aiCanSpend(p,bldCost(p,'farm'),privileged)){
          const anchor=G.blds.find(b=>b.owner===p.id&&b.kind==='mill')||tc||br.base;
          const sp=anchor?aiFindSpot(p,'farm',anchor,1):null;
          if(sp&&aiSpend(p,bldCost(p,'farm'),privileged)){
            const nb=placeBld('farm',sp.x,sp.y,p.id,false);
            cmdBuildAt([u],nb); farmsQueued++; br.cd.farm=AI_CFG.build.cd.farm; continue;
          }
        }
        r=findRes(u.x,u.y,'berry',30);
      }
    }
    else if(k==='w')r=findResFree(p,u.x,u.y,'tree',28,W.tree)||findRes(u.x,u.y,'tree',34);
    else if(k==='g')r=findResFree(p,u.x,u.y,'gold',32,W.gold)||findRes(u.x,u.y,'gold',40);
    else if(k==='s')r=findResFree(p,u.x,u.y,'stone',32,W.stone)||findRes(u.x,u.y,'stone',40);
    if(!r)r=findRes(u.x,u.y,'tree',40)||findRes(u.x,u.y,'berry',40);
    if(r)cmdGather([u],r);
    else if(br.base)cmdMove([u],br.base.x+rndi(6)-3,br.base.y+rndi(6)-3);
  }

  /* ---- construction, with a pending lock and a cooldown per kind ---- */
  const builders=vil.filter(u=>!u.task||u.task.kind==='gather');
  const startBuild=(kind,privileged)=>{
    if(!builders.length||!br.base)return false;
    const B=BLD[kind];
    if(aiPending(p,kind)>=(AI_CFG.build.maxPending[kind]||2))return false;
    const bc=bldCost(p,kind);
    if(!aiCanSpend(p,bc,privileged))return false;
    const anchor = kind==='lumber'? (findRes(br.base.x,br.base.y,'tree',30)||br.base)
                 : kind==='mining'? (findRes(br.base.x,br.base.y,'gold',34)||findRes(br.base.x,br.base.y,'stone',34)||br.base)
                 : br.base;
    const sp=aiFindSpot(p,kind,anchor, kind==='house'?3:2);
    if(!sp)return false;
    if(!aiSpend(p,bc,privileged))return false;
    const nb=placeBld(kind,sp.x,sp.y,p.id,false);
    cmdBuildAt(builders.splice(0,kind==='tc'||kind==='castle'?3:2),nb);
    return true;
  };
  const housesComing=aiPending(p,'house');
  if(econ.type==='REBUILD') startBuild('tc',true);
  else if(p.popCap+housesComing*5-p.pop<=(p.age>0?5:3) && p.popCap<p.popMax &&
          housesComing<AI_CFG.build.maxPending.house && br.cd.house<=0){
    if(startBuild('house'))br.cd.house=AI_CFG.build.cd.house;
  }
  else if(!aiBuildingsOf(p,'lumber')&&vil.length>=6&&!aiPending(p,'lumber')) startBuild('lumber');
  else if(!aiBuildingsOf(p,'mill')&&vil.length>=8&&!aiPending(p,'mill')) startBuild('mill');
  else if(!aiBuildingsOf(p,'mining')&&vil.length>=10&&!aiPending(p,'mining')) startBuild('mining');
  else if(!aiBuildingsOf(p,'barracks')&&vil.length>=(easy?12:9)&&!aiPending(p,'barracks')) startBuild('barracks');
  else if(p.age>=1&&!aiBuildingsOf(p,'range')&&!aiPending(p,'range')) startBuild('range');
  else if(p.age>=1&&!aiBuildingsOf(p,'stable')&&!aiPending(p,'stable')) startBuild('stable');
  else if(civ.landmark&&canBuildKind(p,civ.landmark)&&vil.length>=13&&!aiPending(p,civ.landmark)) startBuild(civ.landmark);
  else if(p.age>=1&&!aiBuildingsOf(p,'smith')&&vil.length>=16&&!aiPending(p,'smith')) startBuild('smith');
  else if(p.age>=1&&aiBuildingsOf(p,'tower')<(hard?3:2)&&aiFree(p,'s')>=200&&aiPending(p,'tower')<2) startBuild('tower');
  else if(p.age>=2&&!aiBuildingsOf(p,'siege')&&!easy&&!aiPending(p,'siege')) startBuild('siege');
  else if(p.age>=2&&aiBuildingsOf(p,'tc')<2&&aiFree(p,'w')>500&&!aiPending(p,'tc')) startBuild('tc');
  else if(p.age>=2&&aiBuildingsOf(p,'barracks')+aiBuildingsOf(p,'range')+aiBuildingsOf(p,'stable')<4&&aiFree(p,'w')>420)
    startBuild(pick(['range','stable','barracks']));

  /* ---- production: reserved resources are simply invisible to these buys ---- */
  for(const b of G.blds){
    if(b.owner!==p.id||b.built<1||b.queue.length>=(hard?4:3))continue;
    const B=BLD[b.kind];
    if(b.kind==='tc'){
      if(econ.type==='AGE_UP'&&!b.queue.some(q=>q.kind==='age')) queueAge(b);
      if(vil.length<econ.vilTarget&&p.pop<p.popCap&&aiCanSpend(p,unitCost(p,'villager')))
        queueUnit(b,'villager');
      if(p.age>=1&&!p.techs.has('wheelbarrow')&&aiFree(p,'f')>400)queueTech(b,'wheelbarrow');
      if(p.age>=2&&!p.techs.has('handcart')&&aiFree(p,'f')>600)queueTech(b,'handcart');
      if(!p.techs.has('loom')&&aiFree(p,'g')>120)queueTech(b,'loom');
    }
    else if(B.trains&&b.kind!=='monastery'){
      if(p.pop<p.popCap-1&&vil.length>=(easy?11:8)){
        const opts=trainsFor(p,b.kind).filter(k=>UNITS[k].age===undefined||UNITS[k].age<=p.age);
        if(opts.length){
          const roll=rnd();
          let kind=opts[opts.length-1];
          if(b.kind==='barracks')kind = p.age>=1&&roll<.4?'spearman':'militia';
          if(b.kind==='range')kind = roll<.72?'archer':'skirmisher';
          if(b.kind==='stable')kind = p.age>=2&&aiFree(p,'g')>200?'knight':'scout';
          if(b.kind==='siege')kind = roll<.5?'ram':'mangonel';
          const fav=((civ.ai&&civ.ai.prefer)||[]).filter(k=>opts.indexOf(k)>=0);
          if(fav.length&&roll<.55)kind=fav[(rnd()*fav.length)|0];
          if(UNITS[kind].age!==undefined&&UNITS[kind].age>p.age)kind=opts[0];
          const garrison = army.length < (hard?8:easy?4:6);   /* always affordable */
          if(aiCanSpend(p,unitCost(p,kind),garrison))queueUnit(b,kind);
        }
      }
    }
    else if(b.kind==='smith'&&aiFree(p,'f')>350){
      for(const t of ['forge1','armor1','fletch1','forge2','armor2','fletch2']){
        const T=TECHS[t]; if((T.age||0)<=p.age&&!p.techs.has(t)&&aiCanSpend(p,T.cost)){ if(queueTech(b,t))break; }
      }
    }
    else if(b.kind==='mill'&&aiFree(p,'f')>300&&p.age>=1&&!p.techs.has('horsecollar'))queueTech(b,'horsecollar');
    else if(b.kind==='lumber'&&aiFree(p,'f')>250&&p.age>=1&&!p.techs.has('axe1'))queueTech(b,'axe1');
    else if(b.kind==='mining'&&aiFree(p,'f')>250&&p.age>=1&&!p.techs.has('mining1'))queueTech(b,'mining1');
  }
  for(const b of G.blds){
    if(b.owner!==p.id||b.built<1||b.queue.length)continue;
    const B=BLD[b.kind]; if(!B.trains)continue;
    for(const k of B.trains){
      const chain=UPGRADES[k]; if(!chain)continue;
      const lvl=p.upg[k]||0, up=chain[lvl];
      if(up&&up.age<=p.age&&aiCanSpend(p,up.cost)&&aiFree(p,'f')>up.cost.f*1.6){queueUpg(b,k,lvl);break;}
    }
  }

  aiMilPlan(p,step);

  /* ---- telemetry: what the planner believes, readable in game and in tests ---- */
  br.tele={age:p.age, econ:econ.type, mil:br.mil?br.mil.type+':'+br.mil.state:'—',
    force:br.mil?br.mil.units.length:0, wave:br.wave,
    reserve:{...br.reserve}, vil:vil.length, army:army.length,
    split:`${counts.f}/${counts.w}/${counts.g}/${counts.s}`,
    want:`${want.f}/${want.w}/${want.g}/${want.s}`,
    pending:G.blds.filter(b=>b.owner===p.id&&b.built<1).map(b=>b.kind).join(',')||'—',
    nextAttack:Math.round(br.nextAttack)};
}

/* ============================================================
   VICTORY
   ============================================================ */
function playerAlive(p){
  if(!p.alive)return false;
  for(const b of G.blds)if(b.owner===p.id)return true;
  for(const u of G.units)if(u.owner===p.id)return true;
  return false;
}
function checkVictory(){
  for(const p of G.players){
    if(p.alive&&!playerAlive(p)){
      p.alive=false;
      if(p===G.human)endGame(false,'Your civilisation has fallen.');
      else pushAlert(p.name+' has been defeated');
    }
    for(const b of G.blds){
      if(b.kind==='wonder'&&b.built>=1&&b.owner===p.id){
        const left=G.wonderTime-(G.time-b.wonderStart);
        if(left<=0){ endGame(p===G.human,(p===G.human?'Your ':p.name+"'s ")+'Wonder stands eternal.'); return; }
        if(!b.warned&&p!==G.human){pushAlert(p.name+' has built a Wonder!','warn');b.warned=true;}
      }
    }
  }
  const enemies=G.players.filter(p=>p!==G.human&&p.alive);
  if(!enemies.length&&G.human.alive&&!G.over) endGame(true,'Every rival banner has fallen.');
}
</script>
<script>
/* ============================================================
   RENDER
   ============================================================ */
const cvs=document.getElementById('game'), ctx=cvs.getContext('2d',{alpha:false});
const cam={x:20,y:20,z:1,minz:.42,maxz:1.75,ox:0,oy:0,vw:0,vh:0,dpr:1,shake:0};
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cam.dpr=dpr; cam.vw=window.innerWidth; cam.vh=window.innerHeight;
  cvs.width=Math.floor(cam.vw*dpr); cvs.height=Math.floor(cam.vh*dpr);
  cvs.style.width=cam.vw+'px'; cvs.style.height=cam.vh+'px';
}
window.addEventListener('resize',()=>{resize();});
function camApply(){
  cam.ox=cam.vw/2-(cam.x-cam.y)*THW*cam.z;
  cam.oy=cam.vh/2-(cam.x+cam.y)*THH*cam.z;
}
function w2sx(wx,wy){return (wx-wy)*THW*cam.z+cam.ox;}
function w2sy(wx,wy){return (wx+wy)*THH*cam.z+cam.oy;}
function s2w(sx,sy){
  const a=(sx-cam.ox)/(THW*cam.z), b=(sy-cam.oy)/(THH*cam.z);
  return {x:(a+b)/2, y:(b-a)/2};
}
function clampCam(){
  cam.x=clamp(cam.x,0,G.w); cam.y=clamp(cam.y,0,G.h);
  cam.z=clamp(cam.z,cam.minz,cam.maxz);
}
/* ---------- fog compositing ---------- */
let fogC=null,fogX=null,fogT=0;
function initFog(){ [fogC,fogX]=cv(G.w,G.h); }
function updateFog(p){
  const img=fogX.createImageData(G.w,G.h), d=img.data;
  for(let i=0;i<G.w*G.h;i++){
    const j=i*4;
    d[j]=6;d[j+1]=5;d[j+2]=4;
    d[j+3]= G.demo? 0 : (p.explored[i] ? (p.vis[i]?0:118) : 255);
  }
  fogX.putImageData(img,0,0);
}
/* ---------- effects ---------- */
function updateFx(dt){
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.t+=dt;if(f.t>=f.life)G.fx.splice(i,1);}
}
function drawFx(f){
  const sx=w2sx(f.x,f.y), sy=w2sy(f.x,f.y), z=cam.z, k=f.t/f.life;
  ctx.save();
  if(f.k==='boom'){
    ctx.globalAlpha=1-k;
    const r=(10+k*34)*z*(f.r||1);
    const g=ctx.createRadialGradient(sx,sy-6*z,1,sx,sy-6*z,r);
    g.addColorStop(0,'rgba(255,226,150,.95)');g.addColorStop(.4,'rgba(226,120,40,.7)');g.addColorStop(1,'rgba(60,30,10,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy-6*z,r,0,7);ctx.fill();
  } else if(f.k==='chip'){
    ctx.globalAlpha=1-k; ctx.fillStyle= f.kind==='tree'?'#7a5a3c':f.kind==='gold'?'#d8a13a':f.kind==='build'?'#c9b389':'#9a9a92';
    for(let i=0;i<3;i++){const a=i*2.1+f.t*6;
      ctx.fillRect(sx+Math.cos(a)*10*k*z, sy-8*z+Math.sin(a)*6*k*z-k*8*z, 2*z,2*z);}
  } else if(f.k==='heal'){
    ctx.globalAlpha=1-k;ctx.fillStyle='#ffe9a8';
    ctx.font=`${12*z}px ${'"Alegreya Sans",sans-serif'}`;ctx.textAlign='center';
    ctx.fillText('+',sx,sy-26*z-k*14*z);
  } else if(f.k==='stump'){
    ctx.globalAlpha=Math.min(1,(1-k)*4);
    const s=ART.deco.stump;ctx.drawImage(s,sx-15*z,sy-16*z,s.width*z,s.height*z);
  } else if(f.k==='corpse'){
    const a=Math.min(1,(1-k)*3);ctx.globalAlpha=a*.85;
    const sp=unitSprite(f.kind,f.ci,DIR_CANON[(f.dir|0)%8],0);
    ctx.translate(sx,sy);ctx.scale(z,z);ctx.rotate(1.2);ctx.globalAlpha=a*.6;
    ctx.drawImage(sp,-sp.ax,-sp.ay);
  } else if(f.k==='rubble'){
    ctx.globalAlpha=Math.min(1,(1-k)*2.2);
    ctx.fillStyle='rgba(48,40,32,.85)';
    for(let i=0;i<6+f.size*3;i++){
      const a=hash2(i,f.size)*6.28, r=hash2(i+7,f.size)*f.size*.6;
      const px=sx+Math.cos(a)*r*THW*z*.9, py=sy+Math.sin(a)*r*THH*z*.9;
      ctx.fillRect(px,py,(3+hash2(i,3)*4)*z,(2+hash2(i,9)*3)*z);
    }
    if(f.t<3){ctx.globalAlpha=(1-f.t/3)*.5;ctx.fillStyle='#2a2018';
      ctx.beginPath();ctx.ellipse(sx,sy-14*z,20*z*f.size*.4,12*z,0,0,7);ctx.fill();}
  } else if(f.k==='ping'){
    ctx.globalAlpha=1-k;ctx.strokeStyle=f.hostile?'#c4503c':'#9fd06a';ctx.lineWidth=2*z;
    ctx.beginPath();ctx.ellipse(sx,sy,(6+k*16)*z,(3+k*8)*z,0,0,7);ctx.stroke();
  }
  ctx.restore();
}
/* ---------- health bar ---------- */
function hpBar(sx,sy,w,frac,col){
  const z=cam.z, W=w*z, H=Math.max(2.5,3.4*z);
  ctx.fillStyle='rgba(8,6,4,.85)';ctx.fillRect(sx-W/2-1,sy-1,W+2,H+2);
  ctx.fillStyle=col||(frac>.6?'#6fa03c':frac>.3?'#c9a227':'#b8392c');
  ctx.fillRect(sx-W/2,sy,W*frac,H);
}
/* ---------- main draw ---------- */
let farmPhase=0;
function draw(dt){
  const p=G.human;
  camApply();
  ctx.setTransform(cam.dpr,0,0,cam.dpr,0,0);
  if(cam.shake>0){ ctx.translate((vrnd()-.5)*cam.shake,(vrnd()-.5)*cam.shake); cam.shake=Math.max(0,cam.shake-dt*30); }
  ctx.fillStyle='#0a1016';ctx.fillRect(0,0,cam.vw,cam.vh);
  ctx.imageSmoothingEnabled=false;
  /* visible tile bounds */
  const m=3;
  const c0=s2w(0,0), c1=s2w(cam.vw,0), c2=s2w(0,cam.vh), c3=s2w(cam.vw,cam.vh);
  const x0=Math.max(0,Math.floor(Math.min(c0.x,c1.x,c2.x,c3.x))-m), x1=Math.min(G.w-1,Math.ceil(Math.max(c0.x,c1.x,c2.x,c3.x))+m);
  const y0=Math.max(0,Math.floor(Math.min(c0.y,c1.y,c2.y,c3.y))-m), y1=Math.min(G.h-1,Math.ceil(Math.max(c0.y,c1.y,c2.y,c3.y))+m);
  const z=cam.z, tw=TW*z, th=TH*z;
  const wf=(G.time*2.2)|0;
  /* terrain */
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const i=idx(x,y);
      if(!p.explored[i])continue;
      const t=G.tile[i];
      const sx=w2sx(x,y)-tw/2, sy=w2sy(x,y);
      let img;
      if(t===TT.WATER||t===TT.SHALLOW) img=ART.water[(wf+((x*3+y*5)%6))%6];
      else img=ART.tiles[t][(hash2(x,y)*6)|0];
      ctx.drawImage(img,sx,sy,tw+1,th+1);
      /* soft transitions with higher-priority neighbours (not worth it zoomed out) */
      if(z<0.62)continue;
      const pr=TT_PRIO[t];
      const nb=[[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]];
      for(let k=0;k<4;k++){
        const nx=x+nb[k][0], ny=y+nb[k][1];
        if(!inMap(nx,ny))continue;
        const nt=G.tile[idx(nx,ny)];
        if(TT_PRIO[nt]<=pr||nt===TT.WATER)continue;
        ctx.drawImage(ART.edges[nt][nb[k][2]],sx,sy,tw+1,th+1);
      }
    }
  }
  ctx.imageSmoothingEnabled=true;
  /* build the depth-sorted draw list */
  const list=[];
  const pad=2.5;
  for(const r of G.res){
    if(r.x<x0-pad||r.x>x1+pad||r.y<y0-pad||r.y>y1+pad)continue;
    if(!p.explored[idx(r.tx,r.ty)])continue;
    list.push(r);
  }
  for(const b of G.blds){
    if(b.x<x0-pad-b.size||b.x>x1+pad||b.y<y0-pad-b.size||b.y>y1+pad)continue;
    if(!p.explored[idx(clamp(b.tx,0,G.w-1),clamp(b.ty,0,G.h-1))])continue;
    list.push(b);
  }
  for(const u of G.units){
    if(u.x<x0-pad||u.x>x1+pad||u.y<y0-pad||u.y>y1+pad)continue;
    if(u.owner!==p.id&&!seenAt(p,u.x,u.y))continue;
    list.push(u);
  }
  for(const f of G.fx){ if(f.x>=x0-pad&&f.x<=x1+pad&&f.y>=y0-pad&&f.y<=y1+pad)list.push(f); }
  list.sort((a,b)=>(a.x+a.y+(a.size?a.size*.5:0))-(b.x+b.y+(b.size?b.size*.5:0)));
  /* selection rings under everything selected */
  for(const id of G.sel){
    const e=G.ents.get(id); if(!e)continue;
    const sx=w2sx(e.x,e.y), sy=w2sy(e.x,e.y);
    ctx.strokeStyle= e.owner===p.id? '#9fd06a' : (e.type==='r'?'#e8d9b5':'#e07a5f');
    ctx.lineWidth=1.7; ctx.globalAlpha=.95;
    ctx.beginPath();
    const rr2=(e.type==='b'? e.size*THW*.62 : e.type==='r'? 16 : 11)*z;
    ctx.ellipse(sx,sy,rr2,rr2*.5,0,0,7);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* rally line */
  if(G.sel.size===1){
    const e=G.ents.get([...G.sel][0]);
    if(e&&e.type==='b'&&e.rally){
      ctx.strokeStyle='rgba(216,161,58,.55)';ctx.setLineDash([5,5]);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(w2sx(e.x,e.y),w2sy(e.x,e.y));ctx.lineTo(w2sx(e.rally.x,e.rally.y),w2sy(e.rally.x,e.rally.y));ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#d8a13a';ctx.beginPath();ctx.arc(w2sx(e.rally.x,e.rally.y),w2sy(e.rally.x,e.rally.y),3.5*z,0,7);ctx.fill();
    }
  }
  /* entities */
  for(const e of list){
    const sx=w2sx(e.x,e.y), sy=w2sy(e.x,e.y);
    if(e.t!==undefined&&e.k){ drawFx(e); continue; }
    if(e.type==='r'){
      let img;
      if(e.kind==='tree')img=ART.deco.tree[e.v%4];
      else if(e.kind==='gold')img=ART.deco.gold[e.v%2];
      else if(e.kind==='stone')img=ART.deco.stone[e.v%2];
      else img=ART.deco.berry[e.v%2];
      const w=img.width*z,h=img.height*z;
      ctx.drawImage(img,sx-w/2,sy-h+8*z,w,h);
      continue;
    }
    if(e.type==='b'){ drawBuilding(e,sx,sy,z,p); continue; }
    drawUnit(e,sx,sy,z,p);
  }
  /* projectiles */
  for(const pr of G.projs){
    if(pr.t<0)continue;
    const sx=w2sx(pr.x,pr.y), sy=w2sy(pr.x,pr.y)-(pr.z||0)*16*z-10*z;
    if(pr.kind==='rock'){
      ctx.fillStyle='#5d564c';ctx.beginPath();ctx.arc(sx,sy,4*z,0,7);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(w2sx(pr.x,pr.y),w2sy(pr.x,pr.y),4*z,2*z,0,0,7);ctx.fill();
    } else {
      const a=Math.atan2((pr.ty-pr.sy)+(pr.tx-pr.sx),(pr.tx-pr.sx)-(pr.ty-pr.sy));
      ctx.save();ctx.translate(sx,sy);ctx.rotate(a);
      ctx.strokeStyle='#e8dcc0';ctx.lineWidth=1.4*z;
      ctx.beginPath();ctx.moveTo(-7*z,0);ctx.lineTo(5*z,0);ctx.stroke();
      ctx.restore();
    }
  }
  /* fog */
  if(fogC){
    ctx.save();
    ctx.imageSmoothingEnabled=true;
    ctx.setTransform(cam.dpr,0,0,cam.dpr,0,0);
    ctx.transform(THW*z,THH*z,-THW*z,THH*z,cam.ox,cam.oy);
    ctx.translate(-0.5,-0.5);
    ctx.drawImage(fogC,0,0);
    ctx.restore();
  }
  /* placement ghost */
  if(G.placing) drawGhost();
  /* drag selection box */
  if(INP.box){
    const b=INP.box;
    ctx.setTransform(cam.dpr,0,0,cam.dpr,0,0);
    ctx.strokeStyle='rgba(159,208,106,.9)';ctx.lineWidth=1.5;
    ctx.fillStyle='rgba(159,208,106,.13)';
    const x=Math.min(b.x0,b.x1),y=Math.min(b.y0,b.y1),w=Math.abs(b.x1-b.x0),h=Math.abs(b.y1-b.y0);
    ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);
  }
  ctx.setTransform(1,0,0,1,0,0);
}
function drawUnit(u,sx,sy,z,p){
  const dir=(u.dir|0)%8;
  const sp=unitSprite(u.kind,G.players[u.owner].ci,DIR_CANON[dir],u.frame|0);
  const flip=DIR_FLIP[dir];
  const put=()=>{
    if(flip){ ctx.save(); ctx.translate(sx,0); ctx.scale(-1,1);
      ctx.drawImage(sp,-sp.ax*z,sy-sp.ay*z,sp.width*z,sp.height*z); ctx.restore(); }
    else ctx.drawImage(sp,sx-sp.ax*z,sy-sp.ay*z,sp.width*z,sp.height*z);
  };
  put();
  if(u.hitT>0){
    ctx.save();
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=u.hitT*1.5;
    put();
    ctx.globalCompositeOperation='source-over';ctx.restore();
  }
  if(u.carry>0){
    const c=u.carryType;
    ctx.fillStyle= c==='w'?'#7a5a3c':c==='g'?'#d8a13a':c==='s'?'#9a9a92':'#c1543a';
    ctx.fillRect(sx+6*z,sy-30*z,5*z,5*z);
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.strokeRect(sx+6*z,sy-30*z,5*z,5*z);
  }
  const dmg=u.hp<u.maxHp;
  if(dmg||G.sel.has(u.id)) hpBar(sx,sy-34*z,16,clamp(u.hp/u.maxHp,0,1),u.owner===p.id?null:'#b8392c');
}
function drawBuilding(b,sx,sy,z,p){
  const B=BLD[b.kind];
  if(b.kind==='farm'){
    const img=ART.deco.farm[b.built<1?0:clamp(b.stage,0,3)];
    ctx.drawImage(img,sx-TW/2*z,sy-(TH/2+3)*z,TW*z,(TH+6)*z);
    if(b.built<1){ctx.strokeStyle='rgba(216,161,58,.8)';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.ellipse(sx,sy,THW*z*.8,THH*z*.8,0,0,7);ctx.stroke();}
    if(G.sel.has(b.id)||b.hp<b.maxHp&&b.built>=1)hpBar(sx,sy-16*z,20,b.built<1?b.built:b.hp/b.maxHp,b.built<1?'#c9a227':null);
    return;
  }
  const sp=bldSprite(b.kind,G.players[b.owner].ci);
  const w=sp.width*z,h=sp.height*z;
  const px=sx-sp.ax*z, py=sy-sp.ay*z;
  const fogged = b.owner!==p.id && !seenAt(p,b.x,b.y);
  if(b.built<1){
    /* foundation + scaffolding, revealed from the ground up */
    ctx.save();
    ctx.globalAlpha=.35;
    ctx.fillStyle='#6b5a44';
    ctx.beginPath();
    ctx.moveTo(sx-b.size*THW*z,sy);ctx.lineTo(sx,sy+b.size*THH*z);
    ctx.lineTo(sx+b.size*THW*z,sy);ctx.lineTo(sx,sy-b.size*THH*z);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    const visH=h*b.built;
    ctx.save();
    ctx.beginPath();ctx.rect(px,py+h-visH-b.size*THH*z*0.0,w,visH+b.size*THH*z);ctx.clip();
    ctx.globalAlpha=.92;ctx.drawImage(sp,px,py,w,h);ctx.restore();
    ctx.strokeStyle='rgba(140,108,64,.85)';ctx.lineWidth=1.6*z;
    for(let i=-1;i<=1;i+=2){
      ctx.beginPath();ctx.moveTo(sx+i*b.size*THW*z*.8,sy+6*z);
      ctx.lineTo(sx+i*b.size*THW*z*.8,sy-(24+b.size*10)*z);ctx.stroke();
    }
    ctx.beginPath();ctx.moveTo(sx-b.size*THW*z*.8,sy-(14+b.size*6)*z);
    ctx.lineTo(sx+b.size*THW*z*.8,sy-(14+b.size*6)*z);ctx.stroke();
    ctx.restore();
    hpBar(sx,sy-(b.size*12+18)*z,26,b.built,'#c9a227');
    return;
  }
  ctx.save();
  if(fogged)ctx.globalAlpha=.72;
  ctx.drawImage(sp,px,py,w,h);
  if(b.hitT>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=b.hitT*.9;
    ctx.drawImage(sp,px,py,w,h);ctx.globalCompositeOperation='source-over';}
  ctx.restore();
  /* mill sails turn */
  if(b.kind==='mill'){
    ctx.save();ctx.translate(sx,sy-(34+0)*z);ctx.rotate(G.time*.7);
    ctx.strokeStyle='#6d4d2c';ctx.lineWidth=2*z;
    for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(i*1.5708)*11*z,Math.sin(i*1.5708)*11*z);ctx.stroke();}
    ctx.restore();
  }
  /* smith & damage smoke */
  const frac=b.hp/b.maxHp;
  if(frac<.6){
    const n=frac<.3?3:1;
    for(let i=0;i<n;i++){
      const t=(G.time*.6+i*.33)%1;
      ctx.globalAlpha=(1-t)*.42;
      ctx.fillStyle= frac<.3? '#e0864a':'#6b6259';
      ctx.beginPath();ctx.arc(sx+(hash2(i,b.id)-.5)*20*z, sy-(20+t*34)*z, (4+t*7)*z,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(G.sel.has(b.id)||frac<1) hpBar(sx,sy-(b.size*13+20)*z,30,frac,b.owner===p.id?null:'#b8392c');
  /* production progress */
  if(b.queue.length&&b.owner===p.id){
    const it=b.queue[0], k=clamp(b.qt/it.time,0,1);
    ctx.fillStyle='rgba(8,6,4,.8)';ctx.fillRect(sx-15*z,sy-(b.size*13+27)*z,30*z,3.5*z);
    ctx.fillStyle='#d8a13a';ctx.fillRect(sx-15*z,sy-(b.size*13+27)*z,30*z*k,3.5*z);
  }
  if(b.kind==='wonder'&&b.built>=1){
    const left=Math.max(0,G.wonderTime-(G.time-b.wonderStart));
    ctx.fillStyle='#f3c869';ctx.font=`${13*z}px "Cinzel",serif`;ctx.textAlign='center';
    ctx.fillText(fmtTime(left),sx,sy-(b.size*13+34)*z);
  }
}
function drawGhost(){
  const pl=G.placing, z=cam.z, B=BLD[pl.kind];
  const tx=pl.tx, ty=pl.ty;
  const ok=pl.ok;
  for(let y=ty;y<ty+B.size;y++)for(let x=tx;x<tx+B.size;x++){
    const sx=w2sx(x,y), sy=w2sy(x,y);
    ctx.fillStyle= ok? 'rgba(159,208,106,.28)':'rgba(196,80,60,.32)';
    ctx.strokeStyle= ok? 'rgba(159,208,106,.75)':'rgba(196,80,60,.8)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sx,sy-THH*z);ctx.lineTo(sx+THW*z,sy);
    ctx.lineTo(sx,sy+THH*z);ctx.lineTo(sx-THW*z,sy);ctx.closePath();ctx.fill();ctx.stroke();
  }
  const cx=w2sx(tx+B.size/2,ty+B.size/2), cy=w2sy(tx+B.size/2,ty+B.size/2);
  const sp=bldSprite(pl.kind,G.human.ci);
  ctx.save();ctx.globalAlpha=ok?.55:.32;
  ctx.drawImage(sp,cx-sp.ax*z,cy-sp.ay*z,sp.width*z,sp.height*z);
  ctx.restore();
}
/* ---------- minimap ---------- */
const mm=document.getElementById('mm'), mmx=mm.getContext('2d');
let mmBase=null,mmT=0;
function buildMMBase(){
  const [c,x]=cv(G.w,G.h);
  const img=x.createImageData(G.w,G.h),d=img.data;
  const col={[TT.WATER]:[32,60,86],[TT.SHALLOW]:[58,102,124],[TT.SAND]:[186,166,120],
    [TT.GRASS]:[74,101,50],[TT.MEADOW]:[95,113,58],[TT.DIRT]:[97,80,54],[TT.ROCK]:[102,100,94]};
  for(let i=0;i<G.w*G.h;i++){const c2=col[G.tile[i]];d[i*4]=c2[0];d[i*4+1]=c2[1];d[i*4+2]=c2[2];d[i*4+3]=255;}
  x.putImageData(img,0,0);
  mmBase=c;
}
function drawMinimap(){
  const W=mm.clientWidth||132, H=mm.clientHeight||78, dpr=Math.min(devicePixelRatio||1,2);
  if(mm.width!==Math.round(W*dpr)){mm.width=Math.round(W*dpr);mm.height=Math.round(H*dpr);}
  const x=mmx, p=G.human;
  const A=Math.min(W,2*H)/(G.w+G.h)*0.97, ox=W/2, oy=H/2;
  const proj=(wx,wy)=>[ox+(wx-wy+(G.h-G.w)/2)*A, oy+(wx+wy-(G.w+G.h)/2)*A/2];
  x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle='#0d0a07';x.fillRect(0,0,W,H);
  x.save();
  x.transform(A,A/2,-A,A/2, ox+(G.h-G.w)/2*A, oy-(G.w+G.h)*A/4);
  x.imageSmoothingEnabled=false;
  x.drawImage(mmBase,0,0);

  x.restore();
  for(const b of G.blds){
    if(!p.explored[idx(clamp(b.tx,0,G.w-1),clamp(b.ty,0,G.h-1))])continue;
    const [sx,sy]=proj(b.x,b.y);
    const r=Math.max(2.5,b.size*A*.8);
    x.fillStyle=G.players[b.owner].color;
    x.fillRect(sx-r/2,sy-r/2,r,r);
  }
  for(const u of G.units){
    if(u.owner!==p.id&&!seenAt(p,u.x,u.y))continue;
    const [sx,sy]=proj(u.x,u.y);
    x.fillStyle=u.owner===p.id?'#cfe6a8':G.players[u.owner].color;
    x.fillRect(sx-1.3,sy-1.3,2.6,2.6);

  x.closePath();x.stroke();
  mm._inv=(mx,my)=>{
    const a=(mx-ox)/A-(G.h-G.w)/2, b2=(my-oy)*2/A+(G.w+G.h)/2;

}
function fmtTime(s){const m=(s/60)|0, ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}

<script>
/* ============================================================
   AUDIO — small synth, no samples

const AUD={ctx:null,on:true,master:null,noise:null,last:{}};
function audioInit(){
  if(AUD.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  AUD.ctx=new AC();
  AUD.master=AUD.ctx.createGain(); AUD.master.gain.value=.30; AUD.master.connect(AUD.ctx.destination);
  const len=AUD.ctx.sampleRate*1.2, buf=AUD.ctx.createBuffer(1,len,AUD.ctx.sampleRate), d=buf.getChannelData(0);

  if(!AUD.on||!AUD.ctx)return;

  const bp=AUD.ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||1.2;

    case 'order': tone(430,.06,'square',.10); tone(640,.05,'square',.07,null,.04); break;
    case 'deny': tone(180,.16,'sawtooth',.15,120); break;

    case 'spawn': tone(620,.09,'triangle',.14); tone(930,.11,'triangle',.10,null,.07); break;

const INP={ptrs:new Map(),box:null,down:null,pinch:null,mode:'pan',lastTap:0,lastTapId:null,

function entAt(sx,sy){
  const w=s2w(sx,sy);
  let best=null,bd=1e9;

    if(u.owner!==G.human.id&&!seenAt(G.human,u.x,u.y))continue;
    const ux=w2sx(u.x,u.y), uy=w2sy(u.x,u.y);

function tryPlace(sx,sy){

/* ---------- pointer plumbing ---------- */

    const [a,b]=[...INP.ptrs.values()];
    INP.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,camx:cam.x,camy:cam.y};

},{passive:false});
function pointerEnd(e){

  }

  if(d.mouse&&d.btn===2){ issueOrder(p.x,p.y); return; }

cvs.addEventListener('pointerup',pointerEnd);
cvs.addEventListener('pointercancel',(e)=>{INP.ptrs.delete(e.pointerId);

      x.beginPath();x.moveTo(-10,8);x.lineTo(6,-8);x.moveTo(-6,-8);x.lineTo(10,8);x.stroke();
      x.beginPath();x.arc(0,0,11,0,6.28);x.strokeStyle='rgba(216,161,58,.5)';x.lineWidth=1.5;x.stroke(); break;

      x.fillStyle='#1b130a';x.font='bold 12px sans-serif';x.textAlign='center';x.fillText('A',0,4); break;
    case 'def': x.fillStyle='#5c7d3a';x.beginPath();x.moveTo(0,-11);x.lineTo(9,-6);x.lineTo(9,4);x.lineTo(0,11);x.lineTo(-9,4);x.lineTo(-9,-6);x.closePath();x.fill();
      x.fillStyle='#1b130a';x.font='bold 12px sans-serif';x.textAlign='center';x.fillText('D',0,4); break;
    case 'pass': x.strokeStyle='#8a7a5c';x.beginPath();x.arc(0,0,9,0,6.28);x.moveTo(-6,-6);x.lineTo(6,6);x.stroke(); break;
    case 'del': x.strokeStyle='#c4503c';x.lineWidth=3;x.beginPath();x.moveTo(-8,-8);x.lineTo(8,8);x.moveTo(8,-8);x.lineTo(-8,8);x.stroke(); break;
    case 'back': x.strokeStyle=V;x.beginPath();x.moveTo(6,-8);x.lineTo(-6,0);x.lineTo(6,8);x.stroke(); break;
    case 'econ': x.fillStyle='#8a6a3c';x.fillRect(-10,2,20,6);
      x.fillStyle='#b98d4a';x.beginPath();x.moveTo(-11,2);x.lineTo(0,-9);x.lineTo(11,2);x.closePath();x.fill(); break;
    case 'mil': x.strokeStyle='#b6bac4';x.lineWidth=2.6;
      x.beginPath();x.moveTo(-8,9);x.lineTo(7,-8);x.stroke();
      x.beginPath();x.moveTo(-9,-8);x.lineTo(8,9);x.stroke();
      x.fillStyle=g;x.fillRect(-2,-2,4,4); break;
    case 'age': x.fillStyle=g;x.beginPath();x.moveTo(-10,8);x.lineTo(-10,-2);x.lineTo(-5,3);x.lineTo(0,-8);x.lineTo(5,3);x.lineTo(10,-2);x.lineTo(10,8);x.closePath();x.fill(); break;
    case 'rally': x.strokeStyle='#6d4d2c';x.lineWidth=2.4;x.beginPath();x.moveTo(-5,10);x.lineTo(-5,-10);x.stroke();
      x.fillStyle=g;x.beginPath();x.moveTo(-4,-10);x.lineTo(9,-6);x.lineTo(-4,-2);x.closePath();x.fill(); break;
    case 'anvil': x.fillStyle='#6a6d75';x.fillRect(-9,-2,18,5);x.fillRect(-4,3,8,6);x.fillRect(-8,9,16,3);
      x.beginPath();x.moveTo(9,-2);x.lineTo(13,-5);x.lineTo(9,-6);x.closePath();x.fill(); break;
    case 'wheat': x.strokeStyle='#c9a227';x.lineWidth=2;x.beginPath();x.moveTo(0,10);x.lineTo(0,-6);x.stroke();
      for(let i=0;i<3;i++){x.beginPath();x.moveTo(0,-6+i*5);x.lineTo(-6,-9+i*5);x.moveTo(0,-6+i*5);x.lineTo(6,-9+i*5);x.stroke();} break;
    case 'heart': x.fillStyle='#c4503c';x.beginPath();x.moveTo(0,9);x.bezierCurveTo(-14,-2,-7,-12,0,-5);x.bezierCurveTo(7,-12,14,-2,0,9);x.fill(); break;
    case 'cart': x.fillStyle='#8a6a3c';x.fillRect(-9,-6,18,8);x.fillStyle='#4a3520';
      x.beginPath();x.arc(-5,5,4,0,7);x.fill();x.beginPath();x.arc(5,5,4,0,7);x.fill(); break;
    case 'bowup': x.strokeStyle='#b98d4a';x.lineWidth=2.2;x.beginPath();x.arc(-2,0,9,-1.2,1.2);x.stroke();
      x.strokeStyle=V;x.lineWidth=1.2;x.beginPath();x.moveTo(1,-8.4);x.lineTo(-4,0);x.lineTo(1,8.4);x.stroke(); break;
    case 'shieldup': x.fillStyle='#8d8f96';x.beginPath();x.moveTo(0,-11);x.lineTo(9,-6);x.lineTo(9,4);x.lineTo(0,11);x.lineTo(-9,4);x.lineTo(-9,-6);x.closePath();x.fill();
      x.fillStyle=g;x.fillRect(-2,-6,4,10); break;
    case 'sword': x.fillStyle='#b6bac4';x.beginPath();x.moveTo(0,-12);x.lineTo(3,-6);x.lineTo(3,6);x.lineTo(-3,6);x.lineTo(-3,-6);x.closePath();x.fill();
      x.fillStyle='#6d4d2c';x.fillRect(-7,6,14,3);x.fillRect(-2,9,4,4); break;
    case 'idle': x.strokeStyle=g;x.lineWidth=2.2;x.beginPath();x.arc(0,0,9,.6,5.6);x.stroke();
      x.fillStyle=g;x.beginPath();x.moveTo(8,-6);x.lineTo(12,2);x.lineTo(4,2);x.closePath();x.fill(); break;
    case 'gold': x.fillStyle=g;x.beginPath();x.arc(0,0,9,0,7);x.fill();x.fillStyle='#8a6a1c';x.font='bold 12px serif';x.textAlign='center';x.fillText('◆',0,4);break;
  }
  return c;
}
function fitCanvas(src,S){
  const [c,x]=cv(S,S);
  const k=Math.min(S/src.width,S/src.height)*(src.width>60?1.0:0.92);
  x.imageSmoothingEnabled=true;
  x.drawImage(src,(S-src.width*k)/2,(S-src.height*k)/2,src.width*k,src.height*k);
  return c;
}
function iconFor(spec){
  const key=JSON.stringify(spec); let c=ART.icon.get(key); if(c)return c;
  if(spec.u) c=fitCanvas(unitSprite(spec.u,G.human?G.human.ci:0,1,0),38);
  else if(spec.b) c=fitCanvas(bldSprite(spec.b,G.human?G.human.ci:0),38);
  else c=glyph(spec.g,38);
  ART.icon.set(key,c); return c;
}
function costStr(cost){
  if(!cost)return '';
  return RES_KEYS.filter(k=>cost[k]).map(k=>cost[k]+RES_NAME[k][0]).join(' ');
}
function needRes(cost){
  const p=G.human, miss=RES_KEYS.filter(k=>cost[k]&&p.res[k]<cost[k]).map(k=>RES_NAME[k]);
  toast('Need more '+miss.join(' & ')); sfx('deny');
}
function buildCommands(){
  const p=G.human, cmds=[];
  const units=selectedUnits(), b=selectedBld();
  const vil=units.filter(u=>u.kind==='villager');
  if(G.placing){
    cmds.push({icon:{g:'back'},t:'Cancel',act:()=>{G.placing=null;UI.page='main';refreshHUD(true);}});
    UI.cmds=cmds; return cmds;
  }
  if(UI.page==='build1'||UI.page==='build2'){
    const civ=CIVS[p.civ]||CIVS.free;
    const list = UI.page==='build1'
      ? ['house','mill','farm','lumber','mining','tc']
      : ['barracks','range','stable','smith','tower',civ.landmark,'siege','monastery','castle','wonder'].filter(Boolean);
    for(const k of list){
      const B=BLD[k];
      if(!canBuildKind(p,k))continue;
      const cost=bldCost(p,k);
      cmds.push({icon:{b:k},t:SHORT[k]||B.n,cost,
        dis:()=>!canAfford(p,cost),
        act:()=>{ if(!canAfford(p,cost)){needRes(cost);return;}
          G.placing={kind:k,tx:0,ty:0,ok:false};
          const c=s2w(cam.vw/2,cam.vh/2); tryPlace(cam.vw/2,cam.vh/2);
          toast('Tap the ground to build'); refreshHUD(true); }});
    }
    cmds.push({icon:{g:'back'},t:'Back',act:()=>{UI.page='main';refreshHUD(true);}});
    UI.cmds=cmds;return cmds;
  }
  if(units.length){
    if(vil.length){
      cmds.push({icon:{g:'econ'},t:'Economy',act:()=>{UI.page='build1';refreshHUD(true);}});
      cmds.push({icon:{g:'mil'},t:'Military',act:()=>{UI.page='build2';refreshHUD(true);}});
    }
    const fighters=units.filter(u=>u.kind!=='villager');
    if(fighters.length){
      cmds.push({icon:{g:'amove'},t:'Attack',act:()=>{UI.armMode='amove';toast('Tap where to attack');}});
      const st=fighters[0].stance;
      cmds.push({icon:{g:st==='aggr'?'aggr':st==='def'?'def':'pass'},
        t:st==='aggr'?'Aggressive':st==='def'?'Defensive':'Passive',
        act:()=>{const nx=st==='aggr'?'def':st==='def'?'pass':'aggr';cmdStance(fighters,nx);refreshHUD(true);toast('Stance: '+(nx==='aggr'?'Aggressive':nx==='def'?'Defensive':'Passive'));}});
    }
    cmds.push({icon:{g:'stop'},t:'Stop',act:()=>cmdStopAll()});
    cmds.push({icon:{g:'idle'},t:'Idle',act:()=>cycleIdle()});
    cmds.push({icon:{g:'del'},t:'Delete',act:()=>{deleteSelected();sfx('deny');}});
    UI.cmds=cmds;return cmds;
  }
  if(b){
    const B=BLD[b.kind];
    if(b.built<1){ cmds.push({icon:{g:'del'},t:'Cancel',act:()=>{refund(p,bldCost(p,b.kind));killEnt(b);refreshHUD(true);}}); UI.cmds=cmds;return cmds; }
    for(const k of trainsFor(p,b.kind)){
      const d=UNITS[k];
      if(d.age!==undefined&&d.age>p.age)continue;
      const st=unitStats(p,k), cost=unitCost(p,k);
      cmds.push({icon:{u:k},t:st.name,cost,dis:()=>!canAfford(p,cost),
        act:()=>{ if(queueUnit(b,k)){sfx('tap');refreshHUD(true);} }});
    }
    if(B.ageup&&p.age<3){
      const a=AGE_UP[p.age+1], cost={}; if(a.f)cost.f=a.f; if(a.g)cost.g=a.g;
      const inQ=b.queue.some(q=>q.kind==='age');
      cmds.push({icon:{g:'age'},t:a.name,cost,dis:()=>inQ||!canAfford(p,cost),
        act:()=>{ if(queueAge(b)){sfx('tap');refreshHUD(true);} }});
    }
    if(B.techs)for(const t of B.techs){
      const T=TECHS[t];
      if((T.age||0)>p.age||p.techs.has(t))continue;
      const gl= t.startsWith('forge')?'sword': t.startsWith('armor')?'shieldup': t.startsWith('fletch')?'bowup':
                t==='loom'?'heart': t==='horsecollar'?'wheat': (t==='wheelbarrow'||t==='handcart')?'cart':'anvil';
      cmds.push({icon:{g:gl},t:T.n,cost:T.cost,tip:T.d,dis:()=>!canAfford(p,T.cost)||b.queue.some(q=>q.id===t),
        act:()=>{ if(queueTech(b,t)){sfx('tap');refreshHUD(true);} }});
    }
    for(const k of trainsFor(p,b.kind)){
      const chain=UPGRADES[k]; if(!chain)continue;
      const lvl=p.upg[k]||0, up=chain[lvl];
      if(up&&up.age<=p.age){
        cmds.push({icon:{g:'sword'},t:up.n,cost:up.cost,tip:'Upgrade '+UNITS[k].n,
          dis:()=>!canAfford(p,up.cost)||b.queue.some(q=>q.kind==='upg'&&q.id===k),
          act:()=>{ if(queueUpg(b,k,lvl)){sfx('tap');refreshHUD(true);} }});
      }
    }
    if(b.queue.length){
      cmds.push({icon:{g:'del'},t:'Cancel',act:()=>{const it=b.queue.pop();if(it&&it.cost)refund(p,it.cost);refreshHUD(true);}});
    }
    cmds.push({icon:{g:'del'},t:'Demolish',act:()=>{if(confirmDemolish(b))refreshHUD(true);}});
    UI.cmds=cmds;return cmds;
  }
  cmds.push({icon:{g:'idle'},t:'Idle',act:()=>cycleIdle()});
  cmds.push({icon:{b:'tc'},t:'Town',act:()=>{const tc=G.blds.find(x2=>x2.owner===p.id&&x2.kind==='tc');if(tc){centerOn(tc.x,tc.y);selectEnt(tc,false);}}});
  cmds.push({icon:{g:'mil'},t:'Army',act:()=>{G.sel.clear();
    for(const u of G.units)if(u.owner===p.id&&u.kind!=='villager')G.sel.add(u.id);
    if(G.sel.size){const f=G.ents.get([...G.sel][0]);centerOn(f.x,f.y);sfx('select');}else toast('No military units');
    refreshHUD(true);}});
  UI.cmds=cmds;return cmds;
}
function confirmDemolish(b){ killEnt(b); sfx('crumble'); return true; }
function refreshHUD(force){
  const p=G.human; if(!p)return;
  /* resources */
  const num=(v)=>{v=Math.floor(v);return v>=10000? (v/1000).toFixed(1)+'k' : String(v);};
  const set=(id,v)=>{const el=$(id);el.querySelector('span').textContent=num(v);el.classList.toggle('low',v<25);};
  set('rFood',p.res.f);set('rWood',p.res.w);set('rGold',p.res.g);set('rStone',p.res.s);
  const pe=$('pop'); pe.querySelector('span').textContent=p.pop+'/'+p.popCap;
  pe.classList.toggle('capped',p.pop>=p.popCap);
  $('age').textContent=AGES[p.age].replace(' Age','');
  /* selection panel */
  const units=selectedUnits(), b=selectedBld();
  const anySel=[...G.sel].map(id=>G.ents.get(id)).filter(Boolean);
  const nameEl=$('selName'),subEl=$('selSub'),statEl=$('selStats'),barEl=$('selBar').firstElementChild,grpEl=$('selGroup'),qEl=$('queue');
  if(anySel.length===0){
    nameEl.textContent='—'; subEl.textContent='Tap a unit or building';
    statEl.innerHTML='';barEl.style.width='0%';grpEl.innerHTML='';qEl.innerHTML='';
  } else if(anySel.length===1){
    const e=anySel[0];
    if(e.type==='u'){
      nameEl.textContent=e.st.name;
      subEl.textContent= e.owner===p.id? (e.task? ({gather:'Gathering',return:'Returning',build:'Building',repair:'Repairing',attack:'Attacking',move:'Moving',amove:'Advancing',heal:'Healing'})[e.task.kind]||'Idle' : 'Idle')
        : G.players[e.owner].name;
      statEl.innerHTML=`<span>HP <b>${Math.ceil(e.hp)}/${e.maxHp}</b></span>
        <span>ATK <b>${e.st.atk}</b></span><span>ARM <b>${e.st.ar}/${e.st.pa}</b></span>
        ${e.carry>0?`<span>Carrying <b>${Math.floor(e.carry)} ${RES_NAME[e.carryType]}</b></span>`:''}`;
      barEl.style.width=(e.hp/e.maxHp*100)+'%';
    } else if(e.type==='b'){
      const B=BLD[e.kind];
      nameEl.textContent=B.n;
      subEl.textContent= e.built<1? 'Under construction '+Math.round(e.built*100)+'%' :
        (e.kind==='farm'? Math.ceil(e.food)+' food left' : (e.owner===p.id?'Ready':G.players[e.owner].name));
      statEl.innerHTML=`<span>HP <b>${Math.ceil(e.hp)}/${e.maxHp}</b></span>${B.atk?`<span>ATK <b>${B.atk}</b></span>`:''}${B.pop?`<span>POP <b>+${B.pop}</b></span>`:''}`;
      barEl.style.width=(e.hp/e.maxHp*100)+'%';
    } else {
      nameEl.textContent={tree:'Forest',gold:'Gold Ore',stone:'Stone',berry:'Berry Bush'}[e.kind];
      subEl.textContent=Math.ceil(e.amt)+' remaining';
      statEl.innerHTML='';barEl.style.width=(e.amt/e.max*100)+'%';
    }
  } else {
    const kinds={};for(const e of anySel){const k=e.type==='u'?e.st.name:BLD[e.kind].n;kinds[k]=(kinds[k]||0)+1;}
    nameEl.textContent=anySel.length+' units';
    subEl.textContent=Object.entries(kinds).map(([k,v])=>v+'× '+k).join(', ');
    const hp=anySel.reduce((a,e)=>a+e.hp,0), mx=anySel.reduce((a,e)=>a+e.maxHp,0);
    statEl.innerHTML=`<span>HP <b>${Math.ceil(hp)}/${mx}</b></span>`;
    barEl.style.width=(hp/mx*100)+'%';
  }
  /* group chips */
  if(force){
    grpEl.innerHTML='';
    if(anySel.length>1){
      anySel.slice(0,14).forEach(e=>{
        const d=document.createElement('div');d.className='chip';
        const ic=e.type==='u'?iconFor({u:e.kind}):iconFor({b:e.kind});
        const cc=document.createElement('canvas');cc.width=cc.height=38;
        cc.getContext('2d').drawImage(ic,0,0);
        d.appendChild(cc);
        d.onclick=()=>{selectEnt(e,false);centerOn(e.x,e.y);};
        grpEl.appendChild(d);
      });
    }
  }
  /* production queue */
  if(b&&b.queue.length){
    qEl.innerHTML='';
    b.queue.slice(0,8).forEach((it,i)=>{
      const d=document.createElement('div');d.className='chip'+(i===0?' on':'');
      const ic= it.kind==='unit'?iconFor({u:it.id}): it.kind==='age'?iconFor({g:'age'}):iconFor({g:'anvil'});
      const cc=document.createElement('canvas');cc.width=cc.height=38;cc.getContext('2d').drawImage(ic,0,0);
      d.appendChild(cc);
      d.onclick=()=>{const item=b.queue.splice(i,1)[0];if(item&&item.cost)refund(G.human,item.cost);refreshHUD(true);};
      qEl.appendChild(d);
    });
  } else if(qEl.childElementCount) qEl.innerHTML='';
  /* opponent planner telemetry */
  const te=$('tele');
  if(!te.hidden){
    te.innerHTML=G.players.filter(x=>x.brain).map(x=>{
      const t=x.brain.tele||{};
      return `<span class="p" style="color:${x.color}">${x.name}</span>  <b>${AGES[t.age||0]}</b>\n`+
        `plan  ${t.econ||'—'} / ${t.mil||'—'}  force ${t.force||0}  wave ${t.wave||0}\n`+
        `vils ${t.vil||0} (${t.split||''} vs ${t.want||''})  army ${t.army||0}\n`+
        `reserve f${Math.round((t.reserve||{}).f||0)} w${Math.round((t.reserve||{}).w||0)} g${Math.round((t.reserve||{}).g||0)}  next atk ${t.nextAttack}\n`+
        `building ${t.pending||'—'}`;
    }).join('\n\n');
  }
  /* command grid */
  const sig=[...G.sel].sort().join(',')+'|'+UI.page+'|'+(G.placing?G.placing.kind:'')+'|'+p.age+'|'+(b?b.queue.length:0);
  if(force||sig!==UI.sig){
    UI.sig=sig;
    const cmds=buildCommands();
    const host=$('cmds'); host.innerHTML='';
    const cols=Math.max(5,Math.min(6,Math.ceil(cmds.length/2)));
    host.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    cmds.forEach((c,i)=>{
      const el=document.createElement('div');el.className='cmd';el.dataset.i=i;
      const ic=iconFor(c.icon);
      const cc=document.createElement('canvas');cc.width=cc.height=38;cc.getContext('2d').drawImage(ic,0,0);
      el.appendChild(cc);
      const t=document.createElement('div');t.className='t';t.textContent=c.t;el.appendChild(t);
      if(c.cost){const s=document.createElement('div');s.className='c';s.textContent=costStr(c.cost);el.appendChild(s);}
      el.addEventListener('pointerdown',(ev)=>{ev.stopPropagation();audioInit();});
      el.addEventListener('click',(ev)=>{ev.stopPropagation();
        if(c.dis&&c.dis()){ if(c.cost)needRes(c.cost); else sfx('deny'); return; }
        sfx('tap'); c.act();});
      host.appendChild(el);
      c.el=el;
    });
  }
  for(const c of UI.cmds||[]){ if(c.el&&c.dis) c.el.classList.toggle('no',!!c.dis()); }
}
/* ---------- notices ---------- */
let toastT=0;
function toast(msg){ if(G.demo)return; const el=$('toast'); el.textContent=msg; el.classList.add('on'); toastT=2.2; }
function showBanner(msg){ if(G.demo)return; const el=$('banner'); el.textContent=msg; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2600); }
function pushAlert(msg,cls,at){
  if(G.demo)return;
  const host=$('alerts'); const d=document.createElement('div');
  d.className='alert'+(cls?' '+cls:''); d.textContent=msg; host.appendChild(d);
  if(at){ d.style.pointerEvents='auto'; d.style.cursor='pointer';
    d.onclick=()=>{centerOn(at.x,at.y);sfx('tap');d.remove();}; }
  setTimeout(()=>d.remove(),5200);
  while(host.childElementCount>4)host.firstChild.remove();
}
function alertUnderAttack(e){
  const p=G.human;
  if(G.time-p.lastAlert<12)return;
  p.lastAlert=G.time;
  pushAlert(e.type==='b'? BLD[e.kind].n+' under attack — tap to view':'Your units are under attack — tap to view','warn',{x:e.x,y:e.y});
  sfx('alarm');
  UI.lastAttack={x:e.x,y:e.y};
}

  else { x.fillStyle='#c9b389';x.beginPath();x.moveTo(-8,3);x.lineTo(0,-6);x.lineTo(8,3);x.closePath();x.fill();
    x.fillStyle='#8f4b33';x.fillRect(-6,3,12,5);
    x.fillStyle='#e8d9b5';x.beginPath();x.arc(0,0,2.4,0,7);x.fill(); }
  return c;
}

function seedStart(p,pos,startRes){
  clearArea(pos.x,pos.y,3);
  const tc=placeBld('tc',pos.x-1,pos.y-1,p.id,true);
  p.res={...startRes};
  for(let i=0;i<4;i++){
    const a=i/4*6.28, sx=pos.x+Math.cos(a)*3.2, sy=pos.y+Math.sin(a)*3.2;
    const o=nearestOpen(sx|0,sy|0,0,6)||{x:pos.x,y:pos.y};
    spawnUnit('villager',p.id,o.x+.5,o.y+.5);
  }
  const so=nearestOpen(pos.x+4,pos.y+1,0,6); if(so)spawnUnit('scout',p.id,so.x+.5,so.y+.5);
  /* guarantee a viable start: berries, gold, stone, wood within reach */
  const need=(kind,count,rad,amt)=>{
    let have=0;
    for(const r of G.res) if(r.kind===kind&&dist(r.x,r.y,pos.x,pos.y)<rad)have++;
    if(have>=count)return;
    let tries=0;
    while(have<count&&tries++<400){
      const a=rnd()*6.28, d=5+rnd()*(rad-5);
      const x=Math.round(pos.x+Math.cos(a)*d), y=Math.round(pos.y+Math.sin(a)*d);
      if(Math.abs(x-pos.x)<4&&Math.abs(y-pos.y)<4)continue;
      if(addRes(kind,x,y,amt,rndi(2)))have++;
    }
  };
  need('berry',6,9,180); need('gold',6,13,800); need('stone',5,15,900); need('tree',22,12,100);
  return tc;
}
function newGame(opts){
  Object.assign(G,{units:[],blds:[],res:[],projs:[],fx:[],ents:new Map(),nextId:1,
    players:[],sel:new Set(),placing:null,time:0,over:false,started:false,paused:false});
  G.demo=!!opts.demo;                       /* the title diorama, never inherited */
  G.tick=0; acc=0;
  G.popMax=opts.pop; G.rateMul=1.4; G.wonderTime=300; G.speed=1;
  const seed=opts.seed||((Math.random()*1e9)|0);
  G.seed=seed;
  const nf=genMap(opts.size,seed);
  pfInit();
  scatterWorld(nf.forest);
  const startRes={f:opts.res,w:opts.res,g:Math.round(opts.res*.5),s:Math.round(opts.res*.5)};
  const nP=opts.players||2;
  const pool=CIV_KEYS.filter(k=>k!==(opts.civ||'free'));
  for(let i=0;i<nP;i++){
    const civ = i===0 ? (opts.civ||'free') : (pool.length? pool.splice((rnd()*pool.length)|0,1)[0] : pick(CIV_KEYS));
    const p=newPlayer(i, i===0? 'You — '+CIVS[civ].n : CIVS[civ].n, i>0, i, civ);
    p.popMax=opts.pop;
    CIVS[civ].mod(p);
    G.players.push(p);
  }
  G.human=G.players[0];
  initVision(G.human);
  const spots=[];
  for(let i=0;i<nP;i++)spots.push(goodStart(opts.size,i,nP));
  ensureConnected(spots);
  G.players.forEach((p,i)=>{
    const tc=seedStart(p,spots[i],startRes);
    if(p.ai){ p.brain=newBrain(p,opts.diff); p.brain.base={x:tc.x,y:tc.y}; }
  });
  initFog(); buildMMBase();
  updateVision(G.human); updateFog(G.human);
  const tc=G.blds.find(b=>b.owner===0);
  cam.x=tc.x;cam.y=tc.y;cam.z=1;clampCam();
  G.started=true;
  if(!G.demo){
    document.querySelectorAll('.hud-el').forEach(e=>e.hidden=false);
    UI.page='main'; UI.sig='';
    refreshHUD(true);
    showBanner('Dark Age');
    pushAlert('Gather food and wood, then advance an age');
  }
}

const SAVE_KEY='ashlands.save.v1';
function b64(arr){let s='';const CH=8192;for(let i=0;i<arr.length;i+=CH)s+=String.fromCharCode.apply(null,arr.subarray(i,i+CH));return btoa(s);}
function unb64(str){const s=atob(str),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function saveGame(){
  try{
    const d={v:1,w:G.w,h:G.h,seed:G.seed,time:G.time,popMax:G.popMax,rate:G.rateMul,
      tile:b64(G.tile),explored:b64(G.human.explored),nextId:G.nextId,
      cam:{x:cam.x,y:cam.y,z:cam.z},
      players:G.players.map(p=>({id:p.id,name:p.name,ai:p.ai,ci:p.ci,civ:p.civ,res:p.res,age:p.age,pop:p.pop,popCap:p.popCap,
        popMax:p.popMax,techs:[...p.techs],upg:p.upg,alive:p.alive,stats:p.stats,
        brain:p.brain?{diff:p.brain.diff,wave:p.brain.wave,nextAttack:p.brain.nextAttack,base:p.brain.base}:null})),
      res:G.res.map(r=>({id:r.id,k:r.kind,x:r.tx,y:r.ty,a:r.amt,m:r.max,v:r.v})),
      blds:G.blds.map(b=>({id:b.id,k:b.kind,o:b.owner,x:b.tx,y:b.ty,hp:b.hp,bu:b.built,q:b.queue,qt:b.qt,
        rally:b.rally?{x:b.rally.x,y:b.rally.y}:null,food:b.food,stage:b.stage,ws:b.wonderStart})),
      units:G.units.map(u=>({id:u.id,k:u.kind,o:u.owner,x:u.x,y:u.y,hp:u.hp,st:u.state,
        t:u.task?u.task.kind:null,tx:u.task&&u.task.x,ty:u.task&&u.task.y,
        tg:u.target?u.target.id:0,hm:u.home?u.home.id:0,c:u.carry,ct:u.carryType,sc:u.stance,d:u.dir})),
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(d));
    toast('Game saved'); return true;
  }catch(err){ toast('Could not save'); return false; }
}
function hasSave(){ try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;} }
function loadGame(){
  let d; try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  if(!d)return false;
  Object.assign(G,{units:[],blds:[],res:[],projs:[],fx:[],ents:new Map(),players:[],sel:new Set(),
    placing:null,over:false,paused:false,started:false});
  G.w=d.w;G.h=d.h;G.seed=d.seed;G.time=d.time;G.popMax=d.popMax;G.rateMul=d.rate||1.4;G.wonderTime=300;G.speed=1;
  G.tile=unb64(d.tile); G.occ=new Int32Array(G.w*G.h); G.nextId=d.nextId;
  pfInit();
  for(const pd of d.players){
    const p=newPlayer(pd.id,pd.name,pd.ai,pd.ci,pd.civ||'free');
    (CIVS[p.civ]||CIVS.free).mod(p);
    Object.assign(p,{res:pd.res,age:pd.age,pop:0,popCap:pd.popCap,popMax:pd.popMax,alive:pd.alive,stats:pd.stats,upg:pd.upg||{}});
    for(const t of pd.techs)applyTech(p,t);
    if(pd.brain){p.brain=newBrain(p,pd.brain.diff);Object.assign(p.brain,pd.brain);}
    G.players.push(p);
  }
  G.human=G.players[0];
  initVision(G.human); G.human.explored.set(unb64(d.explored));
  for(const r of d.res){ const e={id:r.id,type:'r',kind:r.k,tx:r.x,ty:r.y,x:r.x+.5,y:r.y+.5,amt:r.a,max:r.m,v:r.v};
    G.res.push(e);G.ents.set(e.id,e);G.occ[idx(r.x,r.y)]=e.id; }
  for(const b of d.blds){
    const B=BLD[b.k], e={id:b.id,type:'b',kind:b.k,owner:b.o,tx:b.x,ty:b.y,size:B.size,x:b.x+B.size/2,y:b.y+B.size/2,
      maxHp:B.hp,hp:b.hp,built:b.bu,queue:b.q||[],qt:b.qt||0,rally:b.rally,cd:0,alive:true,hitT:0,
      food:b.food||0,stage:b.stage||0,wonderStart:b.ws};
    G.blds.push(e);G.ents.set(e.id,e);
    if(B.landmark)G.players[b.o].landmarks.push(e);
    for(const [x,y] of bldCells(e))G.occ[idx(x,y)]=e.id;
  }
  for(const u of d.units){
    const p=G.players[u.o], st=unitStats(p,u.k);
    const e={id:u.id,type:'u',kind:u.k,owner:u.o,x:u.x,y:u.y,hp:u.hp,maxHp:st.hp,st,
      state:u.st,path:null,pi:0,dir:u.d||0,frame:0,ft:0,cd:0,carry:u.c||0,carryType:u.ct,
      task:u.t?{kind:u.t,x:u.tx,y:u.ty}:null,target:null,home:null,stance:u.sc||'aggr',
      repathT:0,alive:true,hitT:0,_tg:u.tg,_hm:u.hm};
    G.units.push(e);G.ents.set(e.id,e);p.pop++;
  }
  for(const u of G.units){ if(u._tg)u.target=G.ents.get(u._tg)||null; if(u._hm)u.home=G.ents.get(u._hm)||null; }
  initFog(); buildMMBase(); updateVision(G.human); updateFog(G.human);
  cam.x=d.cam.x;cam.y=d.cam.y;cam.z=d.cam.z;clampCam();
  G.started=true;G.demo=false;
  document.querySelectorAll('.hud-el').forEach(e=>e.hidden=false);
  UI.page='main';UI.sig='';refreshHUD(true);
  toast('Game loaded');
  return true;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastT=0;
const TICK=1/30;                 /* simulation runs at a fixed 30 Hz, frame rate independent */
let acc=0;
function simStep(){
  G.tick++; G.time+=TICK;
  rebuildHash();
  for(let i=G.units.length-1;i>=0;i--){const u=G.units[i];if(u.alive)updateUnit(u,TICK);}
  for(let i=G.blds.length-1;i>=0;i--){const b=G.blds[i];if(b.alive)updateBld(b,TICK);}
  updateProjectiles(TICK); updateFx(TICK);
  for(const p of G.players) if(p.ai&&p.alive&&p.brain) aiThink(p,TICK);
  if(G.tick%7===0){ if(!G.demo)updateVision(G.human); updateFog(G.human); }
  if(G.tick%30===0 && !G.demo) checkVictory();
}
/* A cheap FNV-1a over the simulation state. Two runs of the same seed must agree
   tick for tick; this is also the check a lockstep peer would exchange to spot a
   desync early. Positions are quantised so the hash is about state, not float noise. */
function stateHash(){
  let h=2166136261>>>0;
  const mix=(v)=>{ h=(h^((v|0)&0xffffffff))>>>0; h=Math.imul(h,16777619)>>>0; };
  mix(G.tick); mix(G.units.length); mix(G.blds.length); mix(G.res.length);
  for(const u of G.units){ mix(u.id); mix(u.x*64); mix(u.y*64); mix(u.hp*4); mix(u.dir); mix(u.owner); }
  for(const b of G.blds){ mix(b.id); mix(b.hp); mix(b.built*1024); mix(b.queue.length); }
  for(const r of G.res){ mix(r.id); mix(r.amt*4); }
  for(const p of G.players){ mix(p.res.f); mix(p.res.w); mix(p.res.g); mix(p.res.s); mix(p.age); mix(p.pop); }
  return h>>>0;
}
function runTicks(n){ for(let i=0;i<n;i++) simStep(); return stateHash(); }
function frame(t){
  requestAnimationFrame(frame);
  const real=Math.min(.1,(t-(lastT||t))/1000); lastT=t;
  if(G.started&&!G.paused){
    acc+=real*(G.demo?0.9:G.speed);
    const cap=G.speed>2?48:5;              /* never spiral: drop time rather than stall */
    let n=0;
    while(acc>=TICK&&n<cap){ acc-=TICK; simStep(); n++; }
    if(acc>TICK*cap)acc=0;
  }
  if(G.demo){ cam.x+=real*.9; cam.y+=real*.45; if(cam.x>G.w-6||cam.y>G.h-6){cam.x=6;cam.y=6;} clampCam(); }
  else edgePan(real);
  draw(real);
  mmT-=real; if(mmT<=0&&!G.demo){mmT=.1;drawMinimap();}
  UI.hudT-=real; if(UI.hudT<=0&&!G.demo){UI.hudT=.12;refreshHUD(false);}
  if(toastT>0){toastT-=real;if(toastT<=0)$('toast').classList.remove('on');}
}
/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  resize();
  forgeTerrain();
  forgeDeco();
  initResIcons();
  startDemo();
  showTitle();
  $('loading').style.display='none';
  requestAnimationFrame(frame);
}
if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(boot,0);
else window.addEventListener('DOMContentLoaded',boot);
</script>
